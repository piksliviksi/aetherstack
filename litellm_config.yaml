litellm_settings:
  drop_params: true
  set_verbose: false
  # Exposes only active/last model alias and timing to the local VS Code UI.
  # The callback never records prompts, responses, headers, identities, or keys.
  callbacks: aetherstack_callback.proxy_handler_instance
  # Privacy default: do not persist prompts/responses in Redis cache/AOF.
  # Operators may opt in only after documenting their retention policy.
  cache: false
  # Prefer failing with a clear auth/model error over silent wrong defaults
  # request_timeout: 600
  # Guardrail: caps total spend across all cloud-provider calls (xai/openai/anthropic/
  # google/mistral) so a misrouted or fan-out (adaptive/full team) request can't run
  # away. Local Ollama calls are free and unaffected. Raises BudgetExceededError and
  # blocks further paid calls once hit; resets automatically each budget_duration.
  # (Must live here, not general_settings — proxy_server.py only parses budget keys
  # out of litellm_settings.)
  max_budget: 20
  budget_duration: 30d

# Optional: general settings for Redis-backed features
general_settings:
  # master_key is also set via LITELLM_MASTER_KEY env
  alert_types: []
