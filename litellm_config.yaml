# AetherStack — LiteLLM multi-provider config
# One OpenAI-compatible endpoint for local + cloud models.
# Aliases (model_name) are what clients request; litellm_params.model is the provider slug.
# Set API keys in .env — unused providers are simply not called.

model_list:
  # ── Local (WSL Ollama + ROCm/DXG on AMD; keep tiny as default for 6GB WSL) ──
  # Prefer models that are actually pulled. Override by pulling + editing here.
  - model_name: local-default
    litellm_params:
      model: ollama/tinyllama
      api_base: http://host.docker.internal:11434

  - model_name: local-llama
    litellm_params:
      model: ollama/tinyllama
      api_base: http://host.docker.internal:11434

  - model_name: local-tiny
    litellm_params:
      model: ollama/tinyllama
      api_base: http://host.docker.internal:11434

  # Optional larger local models (pull first: ollama pull llama3.1:8b)
  - model_name: local-llama31-8b
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://host.docker.internal:11434

  # ── xAI / Grok (latest first) ─────────────────────────────────────
  - model_name: grok
    litellm_params:
      model: xai/grok-4.5
      api_key: os.environ/XAI_API_KEY

  - model_name: grok-4.5
    litellm_params:
      model: xai/grok-4.5
      api_key: os.environ/XAI_API_KEY

  - model_name: grok-4.3
    litellm_params:
      model: xai/grok-4.3
      api_key: os.environ/XAI_API_KEY

  - model_name: grok-4
    litellm_params:
      model: xai/grok-4
      api_key: os.environ/XAI_API_KEY

  - model_name: grok-4-fast
    litellm_params:
      model: xai/grok-4-1-fast-reasoning
      api_key: os.environ/XAI_API_KEY

  - model_name: grok-4-fast-non-reasoning
    litellm_params:
      model: xai/grok-4-1-fast-non-reasoning
      api_key: os.environ/XAI_API_KEY

  - model_name: grok-code
    litellm_params:
      model: xai/grok-code-fast-1
      api_key: os.environ/XAI_API_KEY

  - model_name: grok-3
    litellm_params:
      model: xai/grok-3
      api_key: os.environ/XAI_API_KEY

  # ── OpenAI ────────────────────────────────────────────────────────
  - model_name: gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: o3
    litellm_params:
      model: openai/o3
      api_key: os.environ/OPENAI_API_KEY

  - model_name: o4-mini
    litellm_params:
      model: openai/o4-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: codex
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai-default
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY

  # ── Anthropic / Claude ────────────────────────────────────────────
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus-4
    litellm_params:
      model: anthropic/claude-opus-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-latest
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── Google Gemini (optional GOOGLE_API_KEY) ───────────────────────
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GOOGLE_API_KEY

  # ── Embeddings (memory / RAG via aether-hub or clients) ───────────
  - model_name: local-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434

  - model_name: openai-embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  # Shared Redis: response cache across workers/clients (lab-friendly)
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 600
  # Prefer failing with a clear auth/model error over silent wrong defaults
  # request_timeout: 600

# Optional: general settings for Redis-backed features
general_settings:
  # master_key is also set via LITELLM_MASTER_KEY env
  alert_types: []
