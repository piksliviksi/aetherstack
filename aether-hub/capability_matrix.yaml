# AetherStack capability / routing sync matrix
# ---------------------------------------------
# model_name values must match litellm_config.yaml aliases (what clients request).
# Live availability is filled at runtime by aether-hub (Ollama probe + env keys).

version: 1
updated: "2026-07-25"

# Capability tags used by /api/route?need=
capabilities:
  chat:
    description: General multi-turn conversation
  code:
    description: Coding, refactor, generate patches
  reason:
    description: Multi-step reasoning / hard analysis
  vision:
    description: Image understanding
  tools:
    description: Function / tool calling
  embed:
    description: Text embeddings for RAG / memory
  private:
    description: Prefer on-device / no cloud egress
  fast:
    description: Low latency interactive use
  cheap:
    description: Cost-sensitive bulk work
  long_context:
    description: Large context windows (100k+)

# Routing policy when several models match
routing:
  prefer_local_for: [private, cheap, fast]
  prefer_cloud_for: [vision, reason, long_context]
  # Ordered fallbacks when primary is offline
  fallbacks:
    chat: [local-default, grok-4.5, gpt-4.1, claude-sonnet-4, mistral-large, gemini-2.5-flash]
    code: [local-default, grok-code, codestral, codex, claude-sonnet-4, gpt-4.1]
    reason: [grok-4.5, o3, claude-opus-4, mistral-large, gemini-2.5-pro, local-default]
    vision: [gpt-4o, gemini-2.5-pro, pixtral, claude-sonnet-4]
    embed: [local-embed, openai-embed]
    private: [local-default, local-llama, local-tiny]
    fast: [local-tiny, local-default, mistral-small, grok-4-fast, gpt-4.1-mini, gemini-flash]
    cheap: [local-default, local-tiny, mistral-small, gpt-4.1-mini, gemini-flash, claude-haiku]
    long_context: [gemini-2.5-pro, gemini-2.5-flash, claude-sonnet-4, mistral-large, gpt-4.1]
  sync:
    # How often hub refreshes Ollama + writes matrix snapshot to Redis (seconds)
    interval_sec: 60
    redis_key: aether:matrix:snapshot

models:
  # ── Local (Ollama) ───────────────────────────────────────────────
  local-default:
    tier: local
    provider: ollama
    backend: ollama/qwen2.5-coder:7b
    capabilities: [chat, code, reason, tools, private, cheap]
    context: 32768
    cost: 0
    latency: low
    notes: Default local — host Ollama selects Metal, Vulkan, ROCm, CUDA, or CPU for the platform

  local-llama:
    tier: local
    provider: ollama
    backend: ollama/llama3.1:8b
    capabilities: [chat, code, reason, tools, private, cheap]
    context: 32768
    cost: 0
    latency: very_low

  local-tiny:
    tier: local
    provider: ollama
    backend: ollama/qwen2.5-coder:0.5b
    capabilities: [chat, code, tools, private, cheap, fast]
    context: 32768
    cost: 0
    latency: very_low
    notes: Tool-capable compact fallback for constrained machines

  local-llama31-8b:
    tier: local
    provider: ollama
    backend: ollama/llama3.1:8b
    capabilities: [chat, code, reason, tools, private]
    context: 8192
    cost: 0
    latency: medium
    notes: Requires ollama pull + WSL memory headroom

  local-embed:
    tier: local
    provider: ollama
    backend: ollama/nomic-embed-text
    capabilities: [embed, private, cheap]
    context: 8192
    cost: 0
    latency: low
    notes: Pull with ollama pull nomic-embed-text

  # ── xAI / Grok ───────────────────────────────────────────────────
  grok-4.5:
    tier: cloud
    provider: xai
    backend: xai/grok-4.5
