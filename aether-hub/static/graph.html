<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AetherStack · Node Graph</title>
  <link rel="icon" type="image/png" href="/aetherstack-icon.png" />
  <style>
    :root {
      --bg: #090a0b; --panel: #111315; --panel-raised: #17191b; --border: #303336;
      --border-strong: #4b4f52; --text: #ecebe7; --muted: #969791; --accent: #d6b36a; --port: #aaa9a3;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg); color: var(--text); overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header { position:sticky; top:0; z-index:21; display:flex; justify-content:space-between; align-items:center; gap:1rem; min-height:62px; padding:.72rem max(1rem,3vw); border-bottom:1px solid var(--border); background:#0d0f10; flex: 0 0 auto; }
    header .brand { display:flex; align-items:center; gap:.7rem; }
    header .logo { width:34px; height:34px; display:block; border-radius:1px; }
    header h1 { margin:0 0 .05rem; font-size:1rem; letter-spacing:.01em; }
    header .muted { color: var(--muted); font-size: 12px; }
    header nav { display:flex; gap:0; align-items:center; flex-wrap:wrap; border:1px solid var(--border); }
    header nav a { padding:.43rem .72rem; border-right:1px solid var(--border); color:var(--muted); text-decoration:none; font-size:13px; }
    header nav a:last-child { border-right:0; }
    header nav a:hover { color:var(--text); background:var(--panel-raised); }
    header nav a.active { color:#17140d; background:var(--accent); font-weight:800; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
      padding: .4rem .55rem; border-bottom: 1px solid var(--border); background: #0d0f10;
      z-index: 20; position: relative; flex: 0 0 auto;
    }
    #toolbar button, #toolbar select, #toolbar input {
      background: var(--panel-raised); border: 1px solid var(--border); color: var(--text);
      border-radius: 1px; padding: .3rem .5rem; font-size: 12px; cursor: pointer;
    }
    #toolbar button.primary { color:#17140d; background: var(--accent); border-color: var(--accent); font-weight:700; }
    #toolbar button:hover { border-color:var(--border-strong); background:#202326; }
    #toolbar button.primary:hover { background:#e0c17d; border-color:#e0c17d; }
    #toolbar .grow { flex: 1; }
    #toolbar .muted { color: var(--muted); font-size: 11px; }
    #wrap { display: flex; flex: 1 1 auto; min-height: 0; }
    #palette {
      width: 170px; flex: 0 0 170px; border-right: 1px solid var(--border); background: var(--panel);
      padding: .5rem; overflow: hidden; font-size: 12px; display: flex; flex-direction: column;
    }
    #palette h3 { margin: 0 0 .35rem; color: var(--muted); font-size: 12px; }
    #paletteTypes { flex: 1; min-height: 0; overflow: auto; }
    #palette .ptype {
      padding: .42rem .48rem; margin: 0; border: 0; border-bottom: 1px solid var(--border);
      cursor: grab; user-select: none;
    }
    #palette .ptype:hover, #palette .ptype:focus-visible { background: var(--panel-raised); outline: none; }
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none;
      background-image: linear-gradient(#202224 1px, transparent 1px), linear-gradient(90deg, #202224 1px, transparent 1px);
      background-size: 20px 20px; }
    #canvas-wrap.panning { cursor: grabbing; }
    #canvas-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    #nodes { position: absolute; inset: 0; z-index: 2; }
    .node {
      position: absolute; min-width: 150px; background: #111315; border: 1px solid var(--border);
      border-left: 3px solid var(--node-color, var(--border-strong)); border-radius: 1px; font-size: 12px;
      user-select: none;
    }
    .node.selected { border-color: var(--accent); outline: 1px solid var(--accent); outline-offset: 1px; }
    .node .hd {
      padding: .35rem .5rem; border-radius: 0; font-weight: 600; cursor: move;
      display: flex; justify-content: space-between; gap: .4rem;
    }
    .node .bd { padding: .4rem .5rem .55rem; color: var(--muted); }
    .node .bd label { display: block; font-size: 10px; margin-top: .25rem; }
    .node .bd input, .node .bd select {
      width: 100%; background: #0b0c0d; border: 1px solid var(--border); color: var(--text);
      border-radius: 1px; padding: .15rem .3rem; font-size: 11px;
    }
    .port {
      width: 12px; height: 12px; border-radius: 50%; background: var(--port);
      border: 2px solid #111315; position: absolute; cursor: crosshair; z-index: 5;
    }
    .port.in { left: -7px; top: 50%; transform: translateY(-50%); }
    .port.out { right: -7px; top: 50%; transform: translateY(-50%); }
    .port.hot { background: var(--accent); outline: 3px solid rgba(214,179,106,.25); }
    .port.multi::after {
      content: attr(data-count); position: absolute; top: -10px; left: 10px;
      font-size: 9px; color: var(--accent); font-weight: 700; pointer-events: none;
    }
    .edge-hit { cursor: pointer; pointer-events: stroke; }
    #toolbar button.active-toggle { color:#17140d; background: var(--accent); border-color: var(--accent); font-weight:700; }
    #toolbar label.chk { display:flex; align-items:center; gap:.3rem; color:var(--muted); font-size:12px; cursor:pointer; user-select:none; }
    #toolbar label.chk input { accent-color: var(--accent); }
    .node .hd-right { display:flex; align-items:center; gap:.35rem; }
    .node.pass-through { min-width: 140px; }
    .node.private-node { border-left-color: #7c6f9e; }
    #inspector {
      width: 200px; border-left: 1px solid var(--border); background: var(--panel);
      padding: .6rem; font-size: 11px; overflow: auto;
    }
    #palette .palette-actions { padding-top: .5rem; border-top: 1px solid var(--border); }
    #palette .palette-actions button { width: 100%; min-height: 34px; padding: .4rem; line-height: 1.2; white-space: normal; border: 1px solid #714040; border-radius: 1px; background: #211415; color: #e4aaaa; cursor: pointer; }
    #palette .palette-actions button:hover { filter: brightness(1.18); }
    #inspector h3 { margin: 0 0 .5rem; font-size: 12px; color: var(--muted); }
    #insp label { display: block; margin-top: .55rem; color: var(--muted); }
    #insp input, #insp select, #insp textarea {
      width: 100%; margin-top: .15rem; background: #0b0c0d; border: 1px solid var(--border);
      color: var(--text); border-radius: 1px; padding: .3rem .4rem; font-size: 11px;
    }
    #insp textarea { min-height: 150px; resize: vertical; line-height: 1.35; }
    #insp .md-actions { display: flex; gap: .35rem; margin-top: .3rem; }
    #insp .md-actions button { flex: 1; background: var(--panel-raised); border: 1px solid var(--border); color: var(--text); border-radius: 1px; padding: .3rem; cursor: pointer; }
    #insp .node-help { margin: .35rem 0 .7rem; color: var(--muted); line-height: 1.35; }
    #insp .runtime { margin-top: .7rem; padding: .45rem; border-left: 2px solid var(--accent); background:#161510; color: var(--muted); line-height: 1.4; }
    #toast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: var(--panel-raised); border: 1px solid var(--border); padding: .4rem .8rem;
      border-radius: 1px; font-size: 12px; display: none; z-index: 50;
    }
    button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.ptype:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <strong id="graphTitle" style="color:var(--accent)">Aether Graph</strong>
    <select id="servicePreset" title="Load a live service preset"><option value="active">Active preset</option></select>
    <button type="button" class="primary" id="btnActive">Load preset tree</button>
    <button type="button" class="primary" id="btnAuto">Auto-connect</button>
    <button type="button" id="btnTemplate">Best-practice template</button>
    <button type="button" id="btnFromPipe">From pipeline…</button>
    <button type="button" id="btnSave">Save</button>
    <button type="button" id="btnPlan">Plan models</button>
    <button type="button" id="btnCenter">Center tree</button>
    <button type="button" id="btnToPipe">Export pipeline JSON</button>
    <label class="chk" title="Allow cycles, feedback edges, and wiring Output back into earlier nodes">
      <input type="checkbox" id="chkRecursive" /> Recursive mode
    </label>
    <input id="maxIter" type="number" min="1" max="50" value="3" title="Max loop iterations when recursive" style="width:3.2rem" />
    <span class="muted" style="font-size:11px">iters</span>
    <span class="grow"></span>
    <span class="muted">Multi-wire · ports fan-in/out · recursive feedback · click edge to select · Del removes</span>
  </div>
  <div id="wrap">
    <div id="palette"><h3>Node library</h3><div id="paletteTypes"></div><div class="palette-actions"><button type="button" id="btnDel">Delete selected node</button></div></div>
    <div id="canvas-wrap">
      <svg id="canvas-svg"></svg>
      <div id="nodes"></div>
    </div>
    <div id="inspector">
      <h3>Inspector</h3>
      <div id="insp">Select a node</div>
      <h3 style="margin-top:1rem">Plan</h3>
      <pre id="planOut" style="white-space:pre-wrap;color:var(--muted);font-size:10px"></pre>
    </div>
  </div>
  <div id="toast"></div>
  <script>
const TYPES = {
  goal: { label: "Goal", color: "#8f918d", description: "Defines the objective and input passed into the agent tree.", passThrough: false },
  master: { label: "Lead agent", color: "#d6b36a", description: "Plans the work, delegates tasks, and owns the final direction.", passThrough: false },
  analyser: { label: "Reviewer", color: "#bd8c66", description: "Challenges evidence and checks an intermediate result before release.", passThrough: false },
  worker: { label: "Worker agent", color: "#7d9b82", description: "Executes a focused part of the active service in parallel or sequentially.", passThrough: false },
  tester: { label: "Test agent", color: "#789596", description: "Runs validation and reports failures back into the workflow.", passThrough: false },
  private: {
    label: "Private",
    color: "#7c6f9e",
    description: "Local GPU-only private inference. Reads a folder of PDFs/text; vault isolation; never cloud.",
    passThrough: false,
  },
  memory: { label: "Memory", color: "#978292", description: "Three-tier context pool: tree / project / global. Pass-through context node.", passThrough: true },
  slash: { label: "Command", color: "#858784", description: "Slash hygiene commands. Pass-through utility node.", passThrough: true },
  output: { label: "Output", color: "#686b69", description: "Collects results (many inputs). Pass-through sink; recursive mode can feedback earlier.", passThrough: true },
};

let graph = {
  schema: "aetherstack.graph.v1",
  id: "canvas-"+Date.now().toString(36),
  title: "Canvas",
  nodes: [],
  edges: [],
  recursive: false,
  max_iterations: 3,
};
let selected = null;
let selectedEdge = null;
let drag = null;
let link = null; // {from, x, y}
let pan = null;
let camera = { x: 0, y: 0 };
const AGENT_NODE_TYPES = new Set(["master", "analyser", "worker", "tester"]);
const PASS_THROUGH_TYPES = new Set(
  Object.keys(TYPES).filter(t => TYPES[t].passThrough)
);
const DRAFT_DATA_KEYS = new Set([
  "label", "text", "role", "agent_ref", "model", "provider", "backend", "tier", "strategy",
  "needs", "available", "service_id", "maker", "max_cost", "parallel", "gate", "ack",
  "purpose", "commands", "namespace", "action", "scope", "project_id",
  "input_folder", "input_globs", "gpu_only", "private_vault",
  "instructions_md", "instructions_source",
]);
const MEMORY_SCOPES = {
  tree: "Tree — this decision graph only; shared by nodes in this canvas",
  project: "Project — all node graphs under the same project",
  global: "Global — pan-project research pool",
};
const MEMORY_ACTIONS = {
  search: "Search — load context from this tier into the flow",
  store: "Store — record sequence output into this tier",
};
const liveChoices = { models: [], agents: [], roles: [] };

const palette = document.getElementById("paletteTypes");
const nodesEl = document.getElementById("nodes");
const svg = document.getElementById("canvas-svg");
const canvasWrap = document.getElementById("canvas-wrap");

Object.keys(TYPES).forEach(t => {
  const d = document.createElement("div");
  d.className = "ptype";
  d.style.borderLeft = "3px solid " + TYPES[t].color;
  d.textContent = TYPES[t].label;
  d.title = TYPES[t].description;
  d.tabIndex = 0;
  d.setAttribute("aria-label", `${TYPES[t].label}: ${TYPES[t].description}`);
  d.draggable = true;
  d.addEventListener("dragstart", e => e.dataTransfer.setData("type", t));
  palette.appendChild(d);
});

canvasWrap.addEventListener("dragover", e => e.preventDefault());
canvasWrap.addEventListener("drop", e => {
  e.preventDefault();
  const t = e.dataTransfer.getData("type");
  if (!t) return;
  const r = canvasWrap.getBoundingClientRect();
  addNode(t, e.clientX - r.left - camera.x - 70, e.clientY - r.top - camera.y - 20);
});

function toast(m) {
  const el = document.getElementById("toast");
  el.textContent = m; el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2200);
}

function uid() { return "n_" + Math.random().toString(36).slice(2, 9); }

function defaultData(t) {
  const map = {
    goal: { label: "Goal", text: "" },
    master: { label: "Lead agent", role: "mastermind", model: null, instructions_md: "", max_cost: "high", strategy: "best_score" },
    analyser: { label: "Reviewer", role: "critic", model: null, instructions_md: "", gate: true, ack: true, max_cost: "high", strategy: "best_score" },
    worker: { label: "Worker agent", role: "builder", tier: null, model: null, instructions_md: "", strategy: "cheapest", parallel: 2, max_cost: "medium" },
    tester: { label: "Test agent", role: "tester", strategy: "cheapest", tier: "local", model: null, instructions_md: "", max_cost: "low" },
    private: {
      label: "Private local",
      role: "private_local",
      tier: "local",
      strategy: "local_first",
      max_cost: "low",
      model: "local-default",
      provider: "ollama",
      backend: "local",
      gpu_only: true,
      private_vault: true,
      input_folder: "",
      input_globs: ["*.pdf", "*.txt", "*.md", "*.markdown", "*.text"],
      instructions_md: "Work only on documents from the configured input folder. Do not send content to cloud providers. Prefer local GPU models.",
    },
    memory: { label: "Memory", scope: "tree", action: "search", project_id: null, namespace: null },
    slash: { label: "Command", commands: ["/done all", "/compact"] },
    output: { label: "Output" },
  };
  return JSON.parse(JSON.stringify(map[t] || {}));
}

function addNode(type, x, y) {
  const n = { id: uid(), type, x, y, data: defaultData(type) };
  graph.nodes.push(n);
  saveGraphLayout();
  render();
  select(n.id);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function graphLayoutKey(value = graph) {
  const identity = value?.service_id || value?.id;
  return identity ? `aetherstack.graph.layout.v1.${identity}` : null;
}

function saveGraphLayout() {
  const key = graphLayoutKey();
  if (!key) return;
  // Persist recursive flags + edges shape in layout draft alongside positions
  const positions = Object.fromEntries((graph.nodes || []).map(node => [
    node.id, { x: Number(node.x) || 0, y: Number(node.y) || 0 },
  ]));
  const nodeData = Object.fromEntries((graph.nodes || []).map(node => [
    node.id,
    Object.fromEntries(Object.entries(node.data || {}).filter(([name]) => DRAFT_DATA_KEYS.has(name))),
  ]));
  try {
    localStorage.setItem(key, JSON.stringify({
      positions, nodeData, camera,
      recursive: !!graph.recursive,
      max_iterations: graph.max_iterations || 3,
      edges: graph.edges || [],
    }));
  } catch { /* storage can be disabled without breaking the editor */ }
}

function restoreGraphLayout() {
  const key = graphLayoutKey();
  camera = { x: 0, y: 0 };
  if (!key) return false;
  try {
    const saved = JSON.parse(localStorage.getItem(key) || "null");
    if (!saved || typeof saved !== "object") return false;
    (graph.nodes || []).forEach(node => {
      const position = saved.positions?.[node.id];
      if (Number.isFinite(position?.x)) node.x = Math.max(-20000, Math.min(20000, position.x));
      if (Number.isFinite(position?.y)) node.y = Math.max(-20000, Math.min(20000, position.y));
      const draft = saved.nodeData?.[node.id];
      if (draft && typeof draft === "object") {
        node.data ||= {};
        Object.entries(draft).forEach(([name, value]) => {
          if (DRAFT_DATA_KEYS.has(name)) node.data[name] = value;
        });
      }
    });
    if (typeof saved.recursive === "boolean") graph.recursive = saved.recursive;
    if (Number.isFinite(saved.max_iterations)) graph.max_iterations = saved.max_iterations;
    if (Array.isArray(saved.edges) && saved.edges.length) {
      // Prefer draft multi-wire / feedback edges when present
      graph.edges = saved.edges;
    }
    if (Number.isFinite(saved.camera?.x)) camera.x = Math.max(-20000, Math.min(20000, saved.camera.x));
    if (Number.isFinite(saved.camera?.y)) camera.y = Math.max(-20000, Math.min(20000, saved.camera.y));
    return true;
  } catch { return false; }
}

function applyCamera() {
  (graph.nodes || []).forEach(node => {
    const el = document.querySelector(`.node[data-id="${node.id}"]`);
    if (el) {
      el.style.left = (node.x + camera.x) + "px";
      el.style.top = (node.y + camera.y) + "px";
    }
  });
  renderEdges();
}

function centerGraph(persist = true) {
  const items = graph.nodes || [];
  if (!items.length) return;
  const minX = Math.min(...items.map(node => Number(node.x) || 0));
  const maxX = Math.max(...items.map(node => Number(node.x) || 0)) + 170;
  const minY = Math.min(...items.map(node => Number(node.y) || 0));
  const maxY = Math.max(...items.map(node => Number(node.y) || 0)) + 80;
  const contentWidth = maxX - minX;
  const contentHeight = maxY - minY;
  camera.x = contentWidth < canvasWrap.clientWidth - 40
    ? (canvasWrap.clientWidth - contentWidth) / 2 - minX
    : 24 - minX;
  camera.y = contentHeight < canvasWrap.clientHeight - 40
    ? (canvasWrap.clientHeight - contentHeight) / 2 - minY
    : 24 - minY;
  applyCamera();
  if (persist) saveGraphLayout();
}

function option(value, label, selectedValue) {
  return `<option value="${esc(value)}" ${String(value) === String(selectedValue ?? "") ? "selected" : ""}>${esc(label)}</option>`;
}

function selectedAgentRef(data) {
  if (data.agent_ref) return data.agent_ref;
  const match = liveChoices.agents.find(agent =>
    (!data.service_id || agent.service_id === data.service_id) &&
    agent.label === data.label && agent.role === data.role && agent.model === data.model
  );
  return match?.ref || "";
}

function agentOptions(data) {
  const current = selectedAgentRef(data);
  let html = option("", "Custom / keep current node", current);
  const groups = new Map();
  liveChoices.agents.forEach(agent => {
    const items = groups.get(agent.service_label) || [];
    items.push(agent);
    groups.set(agent.service_label, items);
  });
  groups.forEach((agents, serviceLabel) => {
    html += `<optgroup label="${esc(serviceLabel)}">`;
    html += agents.map(agent => option(agent.ref, `${agent.label} — ${agent.model}`, current)).join("");
    html += "</optgroup>";
  });
  return html;
}

function modelOptions(current) {
  let html = option("", "Auto-resolve from capabilities", current);
  if (current && !liveChoices.models.some(model => model.alias === current)) {
    html += option(current, `${current} — currently unavailable`, current);
  }
  html += liveChoices.models.map(model =>
    option(model.alias, `${model.alias} — ${model.provider || "unknown"} · ${model.backend || "unknown backend"}`, current)
  ).join("");
  return html;
}

function roleOptions(current) {
  const roles = [...liveChoices.roles];
  if (current && !roles.includes(current)) roles.unshift(current);
  return roles.map(role => option(role, role, current)).join("");
}

const FIELD_LABELS = {
  label: "Node name", text: "Goal or input", role: "Agent role", model: "Model",
  instructions_md: "Behavior instructions (.md)", needs: "Required capabilities",
  strategy: "Model selection", max_cost: "Maximum cost", tier: "Run location",
  parallel: "Parallel workers", gate: "Block until approved", ack: "Require acknowledgement",
  purpose: "Purpose", namespace: "Namespace override", commands: "Slash commands",
  action: "Memory action", scope: "Memory tier", project_id: "Project id",
  input_folder: "Input folder (PDF / text)", input_globs: "File globs",
  gpu_only: "GPU only (local)", private_vault: "Private vault isolation",
};
const INSPECTOR_FIELDS = {
  goal: ["label", "text"],
  master: ["label", "role", "model", "needs", "strategy", "max_cost", "tier", "instructions_md"],
  analyser: ["label", "role", "model", "needs", "strategy", "max_cost", "tier", "gate", "ack", "instructions_md"],
  worker: ["label", "role", "model", "needs", "strategy", "max_cost", "tier", "parallel", "instructions_md"],
  tester: ["label", "role", "model", "needs", "strategy", "max_cost", "tier", "instructions_md"],
  private: ["label", "model", "input_folder", "input_globs", "gpu_only", "private_vault", "instructions_md"],
  memory: ["label", "scope", "action", "project_id", "namespace"],
  slash: ["label", "commands"],
  output: ["label"],
};

function resolveMemoryNamespace(data = {}, graphRef = graph) {
  const override = (data.namespace || "").trim();
  if (override) return override;
  const scope = (data.scope || "tree").toLowerCase();
  if (scope === "global") return "global";
  if (scope === "project") {
    const pid = (data.project_id || graphRef.project_id || graphRef.service_id || "default").toString().trim() || "default";
    return `project:${pid}`;
  }
  const gid = (graphRef.id || "canvas").toString().trim() || "canvas";
  return `tree:${gid}`;
}

function fixedOptions(values, current) {
  return values.map(value => option(value, value.replaceAll("_", " "), current)).join("");
}

function runtimeSummary(data) {
  const details = [];
  if (data.provider) details.push(`Provider: ${esc(data.provider)}`);
  if (data.backend) details.push(`Backend: ${esc(data.backend)}`);
  if (data.available !== undefined) details.push(`State: ${data.available ? "available" : "unavailable"}`);
  return details.length ? `<div class="runtime"><strong>Resolved runtime</strong><br/>${details.join("<br/>")}</div>` : "";
}

function select(id) {
  selected = id;
  render();
  const n = graph.nodes.find(x => x.id === id);
  const insp = document.getElementById("insp");
  if (!n) { insp.textContent = "Select a node"; return; }
  const d = n.data || {};
  const type = TYPES[n.type] || TYPES.worker;
  let html = `<div style="color:${type.color};font-weight:600">${esc(d.label || type.label)}</div>`;
  html += `<div class="node-help">${esc(type.description)}</div>`;
  const isAgentNode = AGENT_NODE_TYPES.has(n.type);
  const isPrivate = n.type === "private";
  if (isAgentNode) {
    html += `<label>Available agent preset<br/><select id="inspectorAgent">${agentOptions(d)}</select></label>`;
    html += `<label>Load behavior profile (.md)<br/><input id="agentMdFile" type="file" accept=".md,text/markdown,text/plain"/></label>`;
    html += `<div class="md-actions"><button type="button" id="clearAgentMd">Clear profile</button></div>`;
    if (d.instructions_source) html += `<div class="muted" style="margin-top:.3rem">Loaded: ${esc(d.instructions_source)}</div>`;
  }
  if (isPrivate) {
    html += `<div class="runtime"><strong>Private local GPU</strong><br/>Infers only on local models (Ollama/GPU). Corpus from folder of PDF / text files. Vault isolation on.</div>`;
  }
  if (PASS_THROUGH_TYPES.has(n.type)) {
    html += `<div class="node-help">Pass-through node — carries context or side effects through the tree without agent inference.</div>`;
  }
  const fields = INSPECTOR_FIELDS[n.type] || ["label"];
  fields.forEach(k => {
    const v = d[k];
    const label = FIELD_LABELS[k] || k;
    if (typeof v === "boolean" || k === "gate" || k === "ack" || k === "gpu_only" || k === "private_vault") {
      html += `<label>${esc(label)}<br/><input type="checkbox" data-k="${esc(k)}" ${v?"checked":""}/></label>`;
    } else if (k === "model" && (isAgentNode || isPrivate)) {
      html += `<label>${esc(label)}<br/><select data-k="model">${modelOptions(v)}</select></label>`;
      if (isPrivate) html += `<div class="node-help">Prefer a local GPU-backed alias (e.g. local-default).</div>`;
    } else if (k === "role" && isAgentNode) {
      html += `<label>${esc(label)}<br/><select data-k="role">${roleOptions(v)}</select></label>`;
    } else if (k === "instructions_md" && (isAgentNode || isPrivate)) {
      html += `<label>${esc(label)}<br/><textarea data-k="instructions_md" placeholder="Role, workflow, constraints, stopping rules, and output format…">${esc(v ?? "")}</textarea></label>`;
    } else if (k === "input_folder" && isPrivate) {
      html += `<label>${esc(label)}<br/><input type="text" data-k="input_folder" value="${esc(v ?? "")}" placeholder="D:/research/private-docs or /data/corpus"/></label>`;
      html += `<div class="node-help">Host path (or Docker mount) containing PDF and text sources for this private branch.</div>`;
    } else if (k === "input_globs" && isPrivate) {
      const raw = Array.isArray(v) ? v.join(", ") : (v ?? "*.pdf, *.txt, *.md");
      html += `<label>${esc(label)}<br/><input data-k="input_globs" data-list="true" value="${esc(raw)}"/></label>`;
    } else if (k === "strategy") {
      html += `<label>${esc(label)}<br/><select data-k="strategy">${option("", "Automatic", v)}${fixedOptions(["best_score", "cheapest", "fastest", "local_first"], v)}</select></label>`;
    } else if (k === "max_cost") {
      html += `<label>${esc(label)}<br/><select data-k="max_cost">${option("", "No node override", v)}${fixedOptions(["low", "medium", "high", "very_high"], v)}</select></label>`;
    } else if (k === "tier" && n.type !== "memory") {
      html += `<label>${esc(label)}<br/><select data-k="tier">${option("", "Any available location", v)}${fixedOptions(["local", "cloud", "host_cli"], v)}</select></label>`;
    } else if (k === "scope" && n.type === "memory") {
      const scopeOpts = Object.keys(MEMORY_SCOPES).map(s => option(s, s, v || "tree")).join("");
      html += `<label>${esc(label)}<br/><select data-k="scope">${scopeOpts}</select></label>`;
      html += `<div class="node-help">${esc(MEMORY_SCOPES[v || "tree"] || "")}</div>`;
    } else if (k === "action" && n.type === "memory") {
      const actOpts = Object.keys(MEMORY_ACTIONS).map(a => option(a, a, v || "search")).join("");
      html += `<label>${esc(label)}<br/><select data-k="action">${actOpts}</select></label>`;
      html += `<div class="node-help">${esc(MEMORY_ACTIONS[v || "search"] || "")}</div>`;
    } else if (k === "project_id" && n.type === "memory") {
      const show = (d.scope || "tree") === "project";
      if (!show) return;
      html += `<label>${esc(label)}<br/><input type="text" data-k="project_id" value="${esc(v ?? graph.project_id ?? graph.service_id ?? "")}" placeholder="project or service id"/></label>`;
      html += `<div class="node-help">Shared by every decision tree under this project id.</div>`;
    } else if (k === "namespace" && n.type === "memory") {
      const resolved = resolveMemoryNamespace(d);
      html += `<label>${esc(label)} <span class="muted">(optional override)</span><br/><input type="text" data-k="namespace" value="${esc(v ?? "")}" placeholder="${esc(resolved)}"/></label>`;
      html += `<div class="runtime"><strong>Resolved namespace</strong><br/>${esc(resolved)}<br/><span class="muted">tree → tree:{graph_id} · project → project:{id} · global → global</span></div>`;
    } else if (Array.isArray(v) || k === "needs" || k === "commands") {
      html += `<label>${esc(label)}<br/><input data-k="${esc(k)}" data-list="true" value="${esc((Array.isArray(v) ? v : []).join(", "))}"/></label>`;
    } else if (k === "text" || k === "purpose") {
      html += `<label>${esc(label)}<br/><textarea data-k="${esc(k)}">${esc(v ?? "")}</textarea></label>`;
    } else {
      const inputType = k === "parallel" ? "number" : "text";
      html += `<label>${esc(label)}<br/><input type="${inputType}" data-k="${esc(k)}" value="${esc(v ?? "")}"/></label>`;
    }
  });
  html += runtimeSummary(d);
  insp.innerHTML = html;
  document.getElementById("inspectorAgent")?.addEventListener("change", event => {
    const agent = liveChoices.agents.find(item => item.ref === event.target.value);
    if (!agent) delete n.data.agent_ref;
    else Object.assign(n.data, {
      agent_ref: agent.ref, label: agent.label, role: agent.role, model: agent.model,
      provider: agent.provider, backend: agent.backend, tier: agent.tier,
      strategy: agent.strategy, needs: [...(agent.needs || [])], available: true,
      service_id: agent.service_id,
    });
    saveGraphLayout();
    select(n.id);
  });
  document.getElementById("agentMdFile")?.addEventListener("change", async event => {
    const file = event.target.files?.[0];
    if (!file) return;
    if (file.size > 262144) { toast("Behavior profile must be 256 KiB or smaller"); return; }
    n.data.instructions_md = await file.text();
    n.data.instructions_source = file.name;
    saveGraphLayout();
    select(n.id);
    toast(`Loaded ${file.name}`);
  });
  document.getElementById("clearAgentMd")?.addEventListener("click", () => {
    n.data.instructions_md = "";
    delete n.data.instructions_source;
    saveGraphLayout();
    select(n.id);
    toast("Behavior profile cleared");
  });
  insp.querySelectorAll("[data-k]").forEach(control => {
    control.addEventListener("change", () => {
      const k = control.dataset.k;
      if (control.type === "checkbox") n.data[k] = control.checked;
      else if (control.dataset.list === "true") n.data[k] = control.value.split(",").map(s => s.trim()).filter(Boolean);
      else {
        const num = Number(control.value);
        n.data[k] = (control.value !== "" && !Number.isNaN(num) && String(num) === control.value) ? num : control.value || null;
        if (k === "model" || k === "role") delete n.data.agent_ref;
        if (k === "model") {
          const model = liveChoices.models.find(item => item.alias === control.value);
          if (model) Object.assign(n.data, {
            provider: model.provider, backend: model.backend, tier: model.tier,
            capabilities: [...(model.capabilities || [])], available: true,
          });
        }
      }
      saveGraphLayout();
      if (k === "model" || k === "role" || k === "scope" || k === "action" || k === "namespace" || k === "project_id") select(n.id);
      else render();
    });
  });
}

function nodeHasInPort(node) {
  // All nodes can receive wires (fan-in); goal usually starts the flow but may take feedback when recursive
  if (node.type === "goal" && !graph.recursive) return false;
  return true;
}
function nodeHasOutPort(node) {
  // Output sinks unless recursive mode enables feedback from output → earlier nodes
  if (node.type === "output" && !graph.recursive) return false;
  return true;
}

function portPos(node, which, slot = 0, slotCount = 1) {
  const el = document.querySelector(`.node[data-id="${node.id}"]`);
  const cr = canvasWrap.getBoundingClientRect();
  let baseX, baseY, h;
  if (!el) {
    baseX = node.x + camera.x + (which === "out" ? 150 : 0);
    baseY = node.y + camera.y + 30;
    h = 48;
  } else {
    const r = el.getBoundingClientRect();
    baseX = (which === "out" ? r.right : r.left) - cr.left;
    baseY = r.top - cr.top;
    h = r.height;
  }
  // Spread multiple edges along the port side so fan-in/fan-out stay readable
  const t = slotCount <= 1 ? 0.5 : (slot + 1) / (slotCount + 1);
  return { x: baseX, y: baseY + h * t };
}

function edgeIndexMaps() {
  const outSlots = {}; // nodeId -> edge ids ordered
  const inSlots = {};
  (graph.edges || []).forEach(e => {
    (outSlots[e.from] ||= []).push(e.id);
    (inSlots[e.to] ||= []).push(e.id);
  });
  return { outSlots, inSlots };
}

function pathExists(fromId, toId, edges = graph.edges) {
  if (fromId === toId) return true;
  const outgoing = {};
  edges.forEach(e => {
    (outgoing[e.from] ||= []).push(e.to);
  });
  const seen = new Set();
  const stack = [fromId];
  while (stack.length) {
    const cur = stack.pop();
    if (seen.has(cur)) continue;
    seen.add(cur);
    for (const nxt of (outgoing[cur] || [])) {
      if (nxt === toId) return true;
      if (!seen.has(nxt)) stack.push(nxt);
    }
  }
  return false;
}

function edgeWouldCycle(fromId, toId) {
  if (fromId === toId) return true;
  // Cycle if target can already reach source
  return pathExists(toId, fromId);
}

function classifyEdgeKind(fromId, toId) {
  if (edgeWouldCycle(fromId, toId)) return "feedback";
  const fromNode = graph.nodes.find(n => n.id === fromId);
  if (fromNode && fromNode.type === "output") return "feedback";
  return "data";
}

function addEdge(fromId, toId) {
  if (!fromId || !toId || fromId === toId) {
    if (fromId === toId && graph.recursive) {
      // self-loop only in recursive mode
    } else if (fromId === toId) {
      toast("Self-loop needs Recursive mode");
      return false;
    } else {
      return false;
    }
  }
  const toNode = graph.nodes.find(n => n.id === toId);
  const fromNode = graph.nodes.find(n => n.id === fromId);
  if (!toNode || !fromNode) return false;
  if (!nodeHasInPort(toNode)) {
    toast("Enable Recursive mode to wire into Goal");
    return false;
  }
  if (!nodeHasOutPort(fromNode)) return false;

  // Unique directed edge (multi fan-in/out allowed across different pairs)
  if ((graph.edges || []).some(e => e.from === fromId && e.to === toId)) {
    toast("Already connected");
    return false;
  }

  const kind = classifyEdgeKind(fromId, toId);
  if (kind === "feedback" && !graph.recursive) {
    toast("Cycle / feedback blocked — turn on Recursive mode");
    return false;
  }
  if (fromNode.type === "output" && !graph.recursive) {
    toast("Output → earlier node needs Recursive mode");
    return false;
  }

  graph.edges = graph.edges || [];
  graph.edges.push({
    id: "e_" + Math.random().toString(36).slice(2, 9),
    from: fromId,
    to: toId,
    kind,
  });
  selectedEdge = graph.edges[graph.edges.length - 1].id;
  selected = null;
  saveGraphLayout();
  render();
  toast(kind === "feedback" ? "Feedback edge (recursive)" : `Wired · fan-in/out ok (${graph.edges.filter(e => e.to === toId).length} in / ${graph.edges.filter(e => e.from === fromId).length} out)`);
  return true;
}

function deleteSelectedEdge() {
  if (!selectedEdge) return false;
  graph.edges = (graph.edges || []).filter(e => e.id !== selectedEdge);
  selectedEdge = null;
  saveGraphLayout();
  render();
  toast("Edge removed");
  return true;
}

function syncRecursiveControls() {
  const chk = document.getElementById("chkRecursive");
  const iter = document.getElementById("maxIter");
  if (chk) chk.checked = !!graph.recursive;
  if (iter) iter.value = String(graph.max_iterations || 3);
}

function renderEdges() {
  const parts = [];
  const { outSlots, inSlots } = edgeIndexMaps();
  // Enable pointer events on svg for edge hit targets
  svg.style.pointerEvents = "auto";
  (graph.edges || []).forEach(e => {
    const a = graph.nodes.find(n => n.id === e.from);
    const b = graph.nodes.find(n => n.id === e.to);
    if (!a || !b) return;
    const outList = outSlots[e.from] || [];
    const inList = inSlots[e.to] || [];
    const p1 = portPos(a, "out", outList.indexOf(e.id), outList.length);
    const p2 = portPos(b, "in", inList.indexOf(e.id), inList.length);
    const mx = (p1.x + p2.x) / 2;
    const isFb = (e.kind || "data") === "feedback";
    const sel = selectedEdge === e.id;
    const stroke = sel ? "#d6b36a" : (isFb ? "#c4875a" : "#777a77");
    const dash = isFb ? "6 4" : "none";
    const width = sel ? 3.2 : 2;
    const d = `M ${p1.x} ${p1.y} C ${mx} ${p1.y}, ${mx} ${p2.y}, ${p2.x} ${p2.y}`;
    // Wide invisible hit path + visible stroke
    parts.push(`<path class="edge-hit" data-edge="${esc(e.id)}" d="${d}" stroke="transparent" stroke-width="12" fill="none"/>`);
    parts.push(`<path data-edge="${esc(e.id)}" d="${d}" stroke="${stroke}" stroke-width="${width}" fill="none" opacity="0.9" stroke-dasharray="${dash}" pointer-events="none"/>`);
    if (isFb) {
      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2;
      parts.push(`<text x="${midX}" y="${midY - 6}" fill="#c4875a" font-size="9" text-anchor="middle" pointer-events="none">↻</text>`);
    }
  });
  if (link) {
    const a = graph.nodes.find(n => n.id === link.from);
    if (a) {
      const outs = (outSlots[link.from] || []).length;
      const p1 = portPos(a, "out", outs, outs + 1);
      parts.push(`<path d="M ${p1.x} ${p1.y} L ${link.x} ${link.y}" stroke="#d6b36a" stroke-width="2" fill="none" stroke-dasharray="4 3" pointer-events="none"/>`);
    }
  }
  svg.innerHTML = parts.join("");
  svg.querySelectorAll("path.edge-hit").forEach(path => {
    path.addEventListener("mousedown", ev => {
      ev.stopPropagation();
      selectedEdge = path.getAttribute("data-edge");
      selected = null;
      render();
      const ed = (graph.edges || []).find(x => x.id === selectedEdge);
      document.getElementById("insp").innerHTML = ed
        ? `<div style="color:var(--accent);font-weight:600">Edge</div>
           <div class="node-help">${esc(ed.kind || "data")} · ${esc(ed.from)} → ${esc(ed.to)}</div>
           <div class="muted">Fan-in/fan-out multi-wire. Press Delete to remove. Feedback edges need Recursive mode.</div>
           <button type="button" id="btnDelEdge" style="margin-top:.5rem;width:100%;background:#211415;border:1px solid #714040;color:#e4aaaa;padding:.35rem;cursor:pointer">Delete edge</button>`
        : "Select a node";
      document.getElementById("btnDelEdge")?.addEventListener("click", () => deleteSelectedEdge());
    });
  });
}

function render() {
  nodesEl.innerHTML = "";
  graph.nodes.forEach(n => {
    const el = document.createElement("div");
    el.className = "node" + (selected === n.id ? " selected" : "");
    el.dataset.id = n.id;
    el.style.left = (n.x + camera.x) + "px";
    el.style.top = (n.y + camera.y) + "px";
    const col = TYPES[n.type]?.color || "#64748b";
    el.style.setProperty("--node-color", col);
    const d = n.data || {};
    el.title = TYPES[n.type]?.description || "Workflow node";
    let sub = "";
    if (n.type === "memory") {
      const sc = d.scope || "tree";
      const act = d.action || "search";
      sub = `${sc} · ${act}`;
    } else if (n.type === "private") {
      const folder = (d.input_folder || "").toString();
      const short = folder ? folder.replace(/\\/g, "/").split("/").filter(Boolean).slice(-2).join("/") : "no folder";
      sub = `GPU · ${short}`;
    } else {
      sub = d.model || d.maker || d.tier || d.text || d.commands?.join(" ") || "";
    }
    if (typeof sub === "string" && sub.length > 28) sub = sub.slice(0, 26) + "…";
    const inCount = (graph.edges || []).filter(e => e.to === n.id).length;
    const outCount = (graph.edges || []).filter(e => e.from === n.id).length;
    const showIn = nodeHasInPort(n);
    const showOut = nodeHasOutPort(n);
    const isPass = PASS_THROUGH_TYPES.has(n.type);
    if (isPass) el.classList.add("pass-through");
    if (n.type === "private") el.classList.add("private-node");
    el.innerHTML = `
      <div class="hd" style="background:#17191b;border-bottom:1px solid var(--border)">
        <span>${esc(d.label || TYPES[n.type]?.label || n.type)}</span>
        <span class="hd-right">
          <span style="opacity:.6;font-weight:400;font-size:10px">${esc(n.type)}</span>
        </span>
      </div>
      <div class="bd">${esc(sub || "—")}${inCount || outCount ? `<div style="margin-top:.25rem;font-size:10px;opacity:.75">in ${inCount} · out ${outCount}</div>` : ""}</div>
      ${showIn ? `<div class="port in${inCount > 1 ? " multi" : ""}" data-port="in" data-count="${inCount > 1 ? inCount : ""}"></div>` : ""}
      ${showOut ? `<div class="port out${outCount > 1 ? " multi" : ""}" data-port="out" data-count="${outCount > 1 ? outCount : ""}"></div>` : ""}
    `;
    const hd = el.querySelector(".hd");
    hd.addEventListener("mousedown", ev => {
      if (ev.button !== 0) return;
      selectedEdge = null;
      select(n.id);
      drag = { id: n.id, ox: ev.clientX - n.x - camera.x, oy: ev.clientY - n.y - camera.y };
    });
    el.addEventListener("mousedown", ev => {
      if (ev.target.classList.contains("port")) return;
      selectedEdge = null;
      select(n.id);
    });
    const pout = el.querySelector(".port.out");
    if (pout) {
      pout.addEventListener("mousedown", ev => {
        ev.stopPropagation();
        const r = canvasWrap.getBoundingClientRect();
        link = { from: n.id, x: ev.clientX - r.left, y: ev.clientY - r.top };
        pout.classList.add("hot");
      });
    }
    const pin = el.querySelector(".port.in");
    if (pin) {
      pin.addEventListener("mouseup", ev => {
        ev.stopPropagation();
        if (link) {
          const fromId = link.from;
          link = null;
          addEdge(fromId, n.id);
        }
      });
      pin.addEventListener("mouseenter", () => { if (link) pin.classList.add("hot"); });
      pin.addEventListener("mouseleave", () => pin.classList.remove("hot"));
    }
    nodesEl.appendChild(el);
  });
  requestAnimationFrame(renderEdges);
  syncRecursiveControls();
}

canvasWrap.addEventListener("mousedown", event => {
  if (event.button !== 0 || (event.target !== canvasWrap && event.target !== nodesEl)) return;
  pan = {
    startX: event.clientX, startY: event.clientY,
    cameraX: camera.x, cameraY: camera.y,
  };
  canvasWrap.classList.add("panning");
  event.preventDefault();
});

canvasWrap.addEventListener("wheel", event => {
  camera.x -= event.shiftKey ? event.deltaY : event.deltaX;
  camera.y -= event.shiftKey ? 0 : event.deltaY;
  applyCamera();
  saveGraphLayout();
  event.preventDefault();
}, { passive: false });

window.addEventListener("mousemove", e => {
  const r = canvasWrap.getBoundingClientRect();
  if (pan) {
    camera.x = pan.cameraX + e.clientX - pan.startX;
    camera.y = pan.cameraY + e.clientY - pan.startY;
    applyCamera();
  }
  if (drag) {
    const n = graph.nodes.find(x => x.id === drag.id);
    if (n) {
      n.x = e.clientX - camera.x - drag.ox;
      n.y = e.clientY - camera.y - drag.oy;
      const el = document.querySelector(`.node[data-id="${n.id}"]`);
      if (el) { el.style.left = (n.x + camera.x) + "px"; el.style.top = (n.y + camera.y) + "px"; }
      renderEdges();
    }
  }
  if (link) {
    link.x = e.clientX - r.left;
    link.y = e.clientY - r.top;
    renderEdges();
  }
});
window.addEventListener("mouseup", () => {
  if (drag || pan) saveGraphLayout();
  drag = null;
  pan = null;
  canvasWrap.classList.remove("panning");
  if (link) { link = null; renderEdges(); }
  document.querySelectorAll(".port.hot").forEach(el => el.classList.remove("hot"));
});

window.addEventListener("keydown", ev => {
  if (ev.key === "Delete" || ev.key === "Backspace") {
    const tag = (ev.target && ev.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || ev.target?.isContentEditable) return;
    if (selectedEdge) {
      ev.preventDefault();
      deleteSelectedEdge();
      return;
    }
    if (selected && document.getElementById("btnDel")) {
      ev.preventDefault();
      document.getElementById("btnDel").click();
    }
  }
  if (ev.key === "Escape") {
    selectedEdge = null;
    link = null;
    render();
  }
});

document.getElementById("chkRecursive").addEventListener("change", ev => {
  graph.recursive = !!ev.target.checked;
  if (!graph.recursive) {
    // Drop feedback edges when leaving recursive mode
    const before = (graph.edges || []).length;
    graph.edges = (graph.edges || []).filter(e => (e.kind || "data") !== "feedback");
    if (graph.edges.length !== before) toast("Removed feedback edges (recursive off)");
  }
  saveGraphLayout();
  render();
  toast(graph.recursive ? "Recursive mode on — cycles & Output→earlier allowed" : "Recursive mode off");
});

document.getElementById("maxIter").addEventListener("change", ev => {
  const n = Math.max(1, Math.min(50, parseInt(ev.target.value, 10) || 3));
  graph.max_iterations = n;
  ev.target.value = String(n);
  saveGraphLayout();
});

document.getElementById("btnDel").onclick = () => {
  if (selectedEdge) { deleteSelectedEdge(); return; }
  if (!selected) return;
  graph.nodes = graph.nodes.filter(n => n.id !== selected);
  graph.edges = graph.edges.filter(e => e.from !== selected && e.to !== selected);
  selected = null;
  saveGraphLayout();
  render();
  document.getElementById("insp").textContent = "Select a node";
};

async function loadServiceGraph(serviceId, announce = true) {
  const id = serviceId || "active";
  saveGraphLayout();
  const response = await fetch(`/api/services/${encodeURIComponent(id)}/graph`);
  const body = await response.json();
  if (!response.ok || body.error) { toast(body.error || `Cannot load ${id}`); return; }
  graph = body;
  graph.recursive = !!body.recursive;
  graph.max_iterations = body.max_iterations || 3;
  graph.edges = body.edges || [];
  const restoredLayout = restoreGraphLayout();
  selected = (body.nodes || []).find(node => node.type === "master")?.id || null;
  selectedEdge = null;
  document.getElementById("graphTitle").textContent = body.title || "Aether Graph";
  syncRecursiveControls();
  if (body.service_id && [...document.getElementById("servicePreset").options].some(option => option.value === body.service_id)) {
    document.getElementById("servicePreset").value = body.service_id;
  }
  render();
  if (selected) select(selected);
  else document.getElementById("insp").textContent = "Select a node";
  if (!restoredLayout) requestAnimationFrame(() => centerGraph(false));
  if (announce) toast(`Loaded ${body.title || id}`);
}

async function loadServiceChoices() {
  const [body, matrix] = await Promise.all([
    fetch("/api/services").then(response => response.ok ? response.json() : {}).catch(() => ({})),
    fetch("/api/matrix").then(response => response.ok ? response.json() : {}).catch(() => ({})),
  ]);
  const select = document.getElementById("servicePreset");
  const active = document.createElement("option"); active.value = "active"; active.textContent = "Active preset";
  select.replaceChildren(active, ...(body.services || []).map(service => {
    const option = document.createElement("option"); option.value = service.id; option.textContent = service.label || service.id; return option;
  }));
  liveChoices.models = Object.entries(matrix.models || {})
    .filter(([, model]) => model.available)
    .map(([alias, model]) => ({ alias, ...model }))
    .sort((a, b) => a.alias.localeCompare(b.alias));
  liveChoices.agents = (body.services || []).flatMap(service =>
    (service.agents || []).filter(agent => agent.available).map(agent => ({
      ...agent, service_id: service.id, service_label: service.label || service.id,
      ref: `${service.id}:${agent.id}`,
    }))
  );
  liveChoices.roles = [...new Set(liveChoices.agents.map(agent => agent.role).filter(Boolean))].sort();
}

document.getElementById("btnActive").onclick = () => loadServiceGraph(document.getElementById("servicePreset").value);
document.getElementById("servicePreset").onchange = () => loadServiceGraph(document.getElementById("servicePreset").value);
document.getElementById("btnCenter").onclick = () => centerGraph();

document.getElementById("btnAuto").onclick = async () => {
  const j = await fetch("/api/graphs/auto-connect", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ graph }),
  }).then(r => r.json());
  if (j.nodes) graph.nodes = j.nodes;
  if (j.edges) graph.edges = j.edges;
  saveGraphLayout();
  render();
  toast("Auto-connected · " + (j.practices || []).length + " practices");
};

document.getElementById("btnTemplate").onclick = async () => {
  const j = await fetch("/api/graphs/template").then(r => r.json());
  graph = j;
  restoreGraphLayout();
  selected = null;
  render();
  toast("Best-practice template loaded");
};

document.getElementById("btnFromPipe").onclick = async () => {
  const id = prompt("Pipeline id (e.g. research-code-test)", "research-code-test");
  if (!id) return;
  const j = await fetch("/api/graphs/from-pipeline", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pipeline_id: id }),
  }).then(r => r.json());
  if (j.error) { toast(j.error); return; }
  graph = j;
  restoreGraphLayout();
  render();
  toast("Loaded pipeline " + id);
};

document.getElementById("btnSave").onclick = async () => {
  const j = await fetch("/api/graphs", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(graph),
  }).then(r => r.json());
  if (j.id) graph.id = j.id;
  saveGraphLayout();
  toast("Saved " + (j.id || ""));
};

document.getElementById("btnPlan").onclick = async () => {
  const j = await fetch("/api/graphs/plan", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ graph, goal: (graph.nodes.find(n => n.type === "goal") || {}).data?.text || "" }),
  }).then(r => r.json());
  document.getElementById("planOut").textContent = (j.flow || "") + "\n" + JSON.stringify(j.stages_resolved || j, null, 2).slice(0, 2500);
  toast("Models resolved for nodes");
};

document.getElementById("btnToPipe").onclick = async () => {
  const j = await fetch("/api/graphs/to-pipeline", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ graph }),
  }).then(r => r.json());
  const blob = new Blob([JSON.stringify(j, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (j.id || "graph") + ".aether-pipeline.json";
  a.click();
  toast("Pipeline JSON downloaded");
};

// Load the requested or currently active capability-resolved service tree.
const requestedService = new URLSearchParams(location.search).get("service") || "active";
loadServiceChoices().then(() => {
  if ([...document.getElementById("servicePreset").options].some(option => option.value === requestedService)) {
    document.getElementById("servicePreset").value = requestedService;
  }
  return loadServiceGraph(requestedService, false);
}).catch(() => render());
window.addEventListener("beforeunload", saveGraphLayout);
  </script>
</body>
</html>
