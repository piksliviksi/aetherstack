<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AetherStack · Node Graph</title>
  <link rel="icon" type="image/png" href="/aetherstack-icon.png" />
  <style>
    :root {
      --bg: #0a0e17; --panel: #121826; --border: #1e293b; --text: #e2e8f0;
      --muted: #64748b; --accent: #38bdf8; --port: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg); color: var(--text); overflow: hidden; }
    #toolbar {
      display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
      padding: .45rem .65rem; border-bottom: 1px solid var(--border); background: var(--panel);
      z-index: 20; position: relative;
    }
    #toolbar button, #toolbar select, #toolbar input {
      background: #0f172a; border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: .3rem .55rem; font-size: 12px; cursor: pointer;
    }
    #toolbar button.primary { background: #0369a1; border-color: #0284c7; }
    #toolbar button:hover { filter: brightness(1.15); }
    #toolbar .grow { flex: 1; }
    #toolbar .muted { color: var(--muted); font-size: 11px; }
    #toolbar .brand-icon { width: 24px; height: 24px; border-radius: 6px; }
    #wrap { display: flex; height: calc(100% - 42px); }
    #palette {
      width: 140px; border-right: 1px solid var(--border); background: var(--panel);
      padding: .5rem; overflow: auto; font-size: 12px;
    }
    #palette .ptype {
      padding: .45rem .5rem; margin: .3rem 0; border-radius: 6px; border: 1px solid var(--border);
      cursor: grab; user-select: none;
    }
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none;
      background-image: radial-gradient(circle, #1e293b 1px, transparent 1px);
      background-size: 20px 20px; }
    #canvas-wrap.panning { cursor: grabbing; }
    #canvas-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    #nodes { position: absolute; inset: 0; z-index: 2; }
    .node {
      position: absolute; min-width: 150px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.35); font-size: 12px;
      user-select: none;
    }
    .node.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .node .hd {
      padding: .35rem .5rem; border-radius: 8px 8px 0 0; font-weight: 600; cursor: move;
      display: flex; justify-content: space-between; gap: .4rem;
    }
    .node .bd { padding: .4rem .5rem .55rem; color: var(--muted); }
    .node .bd label { display: block; font-size: 10px; margin-top: .25rem; }
    .node .bd input, .node .bd select {
      width: 100%; background: #020617; border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; padding: .15rem .3rem; font-size: 11px;
    }
    .port {
      width: 12px; height: 12px; border-radius: 50%; background: var(--port);
      border: 2px solid #0f172a; position: absolute; cursor: crosshair; z-index: 5;
    }
    .port.in { left: -7px; top: 50%; transform: translateY(-50%); }
    .port.out { right: -7px; top: 50%; transform: translateY(-50%); }
    .port.hot { background: var(--accent); }
    #inspector {
      width: 200px; border-left: 1px solid var(--border); background: var(--panel);
      padding: .6rem; font-size: 11px; overflow: auto;
    }
    #inspector h3 { margin: 0 0 .5rem; font-size: 12px; color: var(--muted); }
    #insp label { display: block; margin-top: .55rem; color: var(--muted); }
    #insp input, #insp select, #insp textarea {
      width: 100%; margin-top: .15rem; background: #020617; border: 1px solid var(--border);
      color: var(--text); border-radius: 5px; padding: .3rem .4rem; font-size: 11px;
    }
    #insp textarea { min-height: 150px; resize: vertical; line-height: 1.35; }
    #insp .md-actions { display: flex; gap: .35rem; margin-top: .3rem; }
    #insp .md-actions button { flex: 1; background: #0f172a; border: 1px solid var(--border); color: var(--text); border-radius: 5px; padding: .3rem; cursor: pointer; }
    #toast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid var(--border); padding: .4rem .8rem;
      border-radius: 8px; font-size: 12px; display: none; z-index: 50;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <img class="brand-icon" src="/aetherstack-icon.png" width="24" height="24" alt="" />
    <strong id="graphTitle" style="color:var(--accent)">Aether Graph</strong>
    <select id="servicePreset" title="Load a live service preset"><option value="active">Active preset</option></select>
    <button type="button" class="primary" id="btnActive">Load preset tree</button>
    <button type="button" class="primary" id="btnAuto">Auto-connect</button>
    <button type="button" id="btnTemplate">Best-practice template</button>
    <button type="button" id="btnFromPipe">From pipeline…</button>
    <button type="button" id="btnSave">Save</button>
    <button type="button" id="btnPlan">Plan models</button>
    <button type="button" id="btnCenter">Center tree</button>
    <button type="button" id="btnToPipe">Export pipeline JSON</button>
    <button type="button" id="btnDel">Delete node</button>
    <span class="grow"></span>
    <span class="muted">Drag empty canvas to pan · drag node headers to move · ports to wire</span>
    <a class="muted" href="/" style="color:var(--accent)">← simple</a>
    <a class="muted" href="/advanced" style="color:var(--accent)">advanced</a>
  </div>
  <div id="wrap">
    <div id="palette"></div>
    <div id="canvas-wrap">
      <svg id="canvas-svg"></svg>
      <div id="nodes"></div>
    </div>
    <div id="inspector">
      <h3>Inspector</h3>
      <div id="insp">Select a node</div>
      <h3 style="margin-top:1rem">Plan</h3>
      <pre id="planOut" style="white-space:pre-wrap;color:var(--muted);font-size:10px"></pre>
    </div>
  </div>
  <div id="toast"></div>
  <script>
const TYPES = {
  goal: { label: "Goal", color: "#3b82f6" },
  master: { label: "Master", color: "#a78bfa" },
  analyser: { label: "Analyser", color: "#fbbf24" },
  worker: { label: "Worker", color: "#34d399" },
  tester: { label: "Tester", color: "#22d3ee" },
  memory: { label: "Memory", color: "#fb7185" },
  slash: { label: "Slash", color: "#94a3b8" },
  output: { label: "Output", color: "#64748b" },
};

let graph = { schema: "aetherstack.graph.v1", id: "canvas-"+Date.now().toString(36), title: "Canvas", nodes: [], edges: [] };
let selected = null;
let drag = null;
let link = null; // {from, x, y}
let pan = null;
let camera = { x: 0, y: 0 };
const AGENT_NODE_TYPES = new Set(["master", "analyser", "worker", "tester"]);
const DRAFT_DATA_KEYS = new Set([
  "label", "text", "role", "agent_ref", "model", "provider", "backend", "tier", "strategy",
  "needs", "available", "service_id", "maker", "max_cost", "parallel", "gate", "ack",
  "purpose", "commands", "namespace", "action", "instructions_md", "instructions_source",
]);
const liveChoices = { models: [], agents: [], roles: [] };

const palette = document.getElementById("palette");
const nodesEl = document.getElementById("nodes");
const svg = document.getElementById("canvas-svg");
const canvasWrap = document.getElementById("canvas-wrap");

Object.keys(TYPES).forEach(t => {
  const d = document.createElement("div");
  d.className = "ptype";
  d.style.borderLeft = "3px solid " + TYPES[t].color;
  d.textContent = TYPES[t].label;
  d.draggable = true;
  d.addEventListener("dragstart", e => e.dataTransfer.setData("type", t));
  palette.appendChild(d);
});

canvasWrap.addEventListener("dragover", e => e.preventDefault());
canvasWrap.addEventListener("drop", e => {
  e.preventDefault();
  const t = e.dataTransfer.getData("type");
  if (!t) return;
  const r = canvasWrap.getBoundingClientRect();
  addNode(t, e.clientX - r.left - camera.x - 70, e.clientY - r.top - camera.y - 20);
});

function toast(m) {
  const el = document.getElementById("toast");
  el.textContent = m; el.style.display = "block";
  setTimeout(() => el.style.display = "none", 2200);
}

function uid() { return "n_" + Math.random().toString(36).slice(2, 9); }

function defaultData(t) {
  const map = {
    goal: { text: "" },
    master: { role: "mastermind", maker: null, model: null, instructions_md: "", max_cost: "high", strategy: "best_score" },
    analyser: { role: "critic", maker: null, model: null, instructions_md: "", gate: true, ack: true, max_cost: "high", strategy: "best_score" },
    worker: { role: "builder", tier: null, model: null, instructions_md: "", strategy: "cheapest", parallel: 2, max_cost: "medium" },
    tester: { role: "tester", strategy: "cheapest", tier: "local", model: null, instructions_md: "", max_cost: "low" },
    memory: { namespace: "default" },
    slash: { commands: ["/done all", "/compact"] },
    output: {},
  };
  return JSON.parse(JSON.stringify(map[t] || {}));
}

function addNode(type, x, y) {
  const n = { id: uid(), type, x, y, data: defaultData(type) };
  graph.nodes.push(n);
  saveGraphLayout();
  render();
  select(n.id);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function graphLayoutKey(value = graph) {
  const identity = value?.service_id || value?.id;
  return identity ? `aetherstack.graph.layout.v1.${identity}` : null;
}

function saveGraphLayout() {
  const key = graphLayoutKey();
  if (!key) return;
  const positions = Object.fromEntries((graph.nodes || []).map(node => [
    node.id, { x: Number(node.x) || 0, y: Number(node.y) || 0 },
  ]));
  const nodeData = Object.fromEntries((graph.nodes || []).map(node => [
    node.id,
    Object.fromEntries(Object.entries(node.data || {}).filter(([name]) => DRAFT_DATA_KEYS.has(name))),
  ]));
  try { localStorage.setItem(key, JSON.stringify({ positions, nodeData, camera })); }
  catch { /* storage can be disabled without breaking the editor */ }
}

function restoreGraphLayout() {
  const key = graphLayoutKey();
  camera = { x: 0, y: 0 };
  if (!key) return false;
  try {
    const saved = JSON.parse(localStorage.getItem(key) || "null");
    if (!saved || typeof saved !== "object") return false;
    (graph.nodes || []).forEach(node => {
      const position = saved.positions?.[node.id];
      if (Number.isFinite(position?.x)) node.x = Math.max(-20000, Math.min(20000, position.x));
      if (Number.isFinite(position?.y)) node.y = Math.max(-20000, Math.min(20000, position.y));
      const draft = saved.nodeData?.[node.id];
      if (draft && typeof draft === "object") {
        node.data ||= {};
        Object.entries(draft).forEach(([name, value]) => {
          if (DRAFT_DATA_KEYS.has(name)) node.data[name] = value;
        });
      }
    });
    if (Number.isFinite(saved.camera?.x)) camera.x = Math.max(-20000, Math.min(20000, saved.camera.x));
    if (Number.isFinite(saved.camera?.y)) camera.y = Math.max(-20000, Math.min(20000, saved.camera.y));
    return true;
  } catch { return false; }
}

function applyCamera() {
  (graph.nodes || []).forEach(node => {
    const el = document.querySelector(`.node[data-id="${node.id}"]`);
    if (el) {
      el.style.left = (node.x + camera.x) + "px";
      el.style.top = (node.y + camera.y) + "px";
    }
  });
  renderEdges();
}

function centerGraph(persist = true) {
  const items = graph.nodes || [];
  if (!items.length) return;
  const minX = Math.min(...items.map(node => Number(node.x) || 0));
  const maxX = Math.max(...items.map(node => Number(node.x) || 0)) + 170;
  const minY = Math.min(...items.map(node => Number(node.y) || 0));
  const maxY = Math.max(...items.map(node => Number(node.y) || 0)) + 80;
  const contentWidth = maxX - minX;
  const contentHeight = maxY - minY;
  camera.x = contentWidth < canvasWrap.clientWidth - 40
    ? (canvasWrap.clientWidth - contentWidth) / 2 - minX
    : 24 - minX;
  camera.y = contentHeight < canvasWrap.clientHeight - 40
    ? (canvasWrap.clientHeight - contentHeight) / 2 - minY
    : 24 - minY;
  applyCamera();
  if (persist) saveGraphLayout();
}

function option(value, label, selectedValue) {
  return `<option value="${esc(value)}" ${String(value) === String(selectedValue ?? "") ? "selected" : ""}>${esc(label)}</option>`;
}

function selectedAgentRef(data) {
  if (data.agent_ref) return data.agent_ref;
  const match = liveChoices.agents.find(agent =>
    (!data.service_id || agent.service_id === data.service_id) &&
    agent.label === data.label && agent.role === data.role && agent.model === data.model
  );
  return match?.ref || "";
}

function agentOptions(data) {
  const current = selectedAgentRef(data);
  let html = option("", "Custom / keep current node", current);
  const groups = new Map();
  liveChoices.agents.forEach(agent => {
    const items = groups.get(agent.service_label) || [];
    items.push(agent);
    groups.set(agent.service_label, items);
  });
  groups.forEach((agents, serviceLabel) => {
    html += `<optgroup label="${esc(serviceLabel)}">`;
    html += agents.map(agent => option(agent.ref, `${agent.label} — ${agent.model}`, current)).join("");
    html += "</optgroup>";
  });
  return html;
}

function modelOptions(current) {
  let html = option("", "Auto-resolve from capabilities", current);
  if (current && !liveChoices.models.some(model => model.alias === current)) {
    html += option(current, `${current} — currently unavailable`, current);
  }
  html += liveChoices.models.map(model =>
    option(model.alias, `${model.alias} — ${model.provider || "unknown"} · ${model.backend || "unknown backend"}`, current)
  ).join("");
  return html;
}

function roleOptions(current) {
  const roles = [...liveChoices.roles];
  if (current && !roles.includes(current)) roles.unshift(current);
  return roles.map(role => option(role, role, current)).join("");
}

function select(id) {
  selected = id;
  render();
  const n = graph.nodes.find(x => x.id === id);
  const insp = document.getElementById("insp");
  if (!n) { insp.textContent = "Select a node"; return; }
  const d = n.data || {};
  const type = TYPES[n.type] || TYPES.worker;
  let html = `<div style="color:${type.color};font-weight:600">${esc(d.label || type.label)}</div>`;
  html += `<div class="muted">${esc(n.id)}</div>`;
  const isAgentNode = AGENT_NODE_TYPES.has(n.type);
  if (isAgentNode) {
    html += `<label>available agent<br/><select id="inspectorAgent">${agentOptions(d)}</select></label>`;
    html += `<label>load behavior profile (.md)<br/><input id="agentMdFile" type="file" accept=".md,text/markdown,text/plain"/></label>`;
    html += `<div class="md-actions"><button type="button" id="clearAgentMd">Clear profile</button></div>`;
    if (d.instructions_source) html += `<div class="muted" style="margin-top:.3rem">Loaded: ${esc(d.instructions_source)}</div>`;
  }
  const fields = Object.keys(d).filter(k => k !== "agent_ref" && k !== "instructions_source");
  if (isAgentNode && !fields.includes("model")) fields.push("model");
  if (isAgentNode && !fields.includes("instructions_md")) fields.push("instructions_md");
  fields.forEach(k => {
    const v = d[k];
    if (typeof v === "boolean") {
      html += `<label>${esc(k)}<br/><input type="checkbox" data-k="${esc(k)}" ${v?"checked":""}/></label>`;
    } else if (k === "model" && isAgentNode) {
      html += `<label>model<br/><select data-k="model">${modelOptions(v)}</select></label>`;
    } else if (k === "role" && isAgentNode) {
      html += `<label>role<br/><select data-k="role">${roleOptions(v)}</select></label>`;
    } else if (k === "instructions_md" && isAgentNode) {
      html += `<label>behavior instructions (.md)<br/><textarea data-k="instructions_md" placeholder="Role, workflow, constraints, stopping rules, and output format…">${esc(v ?? "")}</textarea></label>`;
    } else if (Array.isArray(v)) {
      html += `<label>${esc(k)}<br/><input data-k="${esc(k)}" value="${esc(v.join(", "))}"/></label>`;
    } else {
      html += `<label>${esc(k)}<br/><input data-k="${esc(k)}" value="${esc(v ?? "")}"/></label>`;
    }
  });
  insp.innerHTML = html;
  document.getElementById("inspectorAgent")?.addEventListener("change", event => {
    const agent = liveChoices.agents.find(item => item.ref === event.target.value);
    if (!agent) delete n.data.agent_ref;
    else Object.assign(n.data, {
      agent_ref: agent.ref, label: agent.label, role: agent.role, model: agent.model,
      provider: agent.provider, backend: agent.backend, tier: agent.tier,
      strategy: agent.strategy, needs: [...(agent.needs || [])], available: true,
      service_id: agent.service_id,
    });
    saveGraphLayout();
    select(n.id);
  });
  document.getElementById("agentMdFile")?.addEventListener("change", async event => {
    const file = event.target.files?.[0];
    if (!file) return;
    if (file.size > 262144) { toast("Behavior profile must be 256 KiB or smaller"); return; }
    n.data.instructions_md = await file.text();
    n.data.instructions_source = file.name;
    saveGraphLayout();
    select(n.id);
    toast(`Loaded ${file.name}`);
  });
  document.getElementById("clearAgentMd")?.addEventListener("click", () => {
    n.data.instructions_md = "";
    delete n.data.instructions_source;
    saveGraphLayout();
    select(n.id);
    toast("Behavior profile cleared");
  });
  insp.querySelectorAll("[data-k]").forEach(control => {
    control.addEventListener("change", () => {
      const k = control.dataset.k;
      if (control.type === "checkbox") n.data[k] = control.checked;
      else if (Array.isArray(d[k])) n.data[k] = control.value.split(",").map(s => s.trim()).filter(Boolean);
      else {
        const num = Number(control.value);
        n.data[k] = (control.value !== "" && !Number.isNaN(num) && String(num) === control.value) ? num : control.value || null;
        if (k === "model" || k === "role") delete n.data.agent_ref;
        if (k === "model") {
          const model = liveChoices.models.find(item => item.alias === control.value);
          if (model) Object.assign(n.data, {
            provider: model.provider, backend: model.backend, tier: model.tier,
            capabilities: [...(model.capabilities || [])], available: true,
          });
        }
      }
      saveGraphLayout();
      if (k === "model" || k === "role") select(n.id);
      else render();
    });
  });
}

function portPos(node, which) {
  const el = document.querySelector(`.node[data-id="${node.id}"]`);
  if (!el) return { x: node.x + camera.x, y: node.y + camera.y + 30 };
  const r = el.getBoundingClientRect();
  const cr = canvasWrap.getBoundingClientRect();
  return {
    x: (which === "out" ? r.right : r.left) - cr.left,
    y: r.top + r.height / 2 - cr.top,
  };
}

function renderEdges() {
  const parts = [];
  graph.edges.forEach(e => {
    const a = graph.nodes.find(n => n.id === e.from);
    const b = graph.nodes.find(n => n.id === e.to);
    if (!a || !b) return;
    const p1 = portPos(a, "out");
    const p2 = portPos(b, "in");
    const mx = (p1.x + p2.x) / 2;
    parts.push(`<path d="M ${p1.x} ${p1.y} C ${mx} ${p1.y}, ${mx} ${p2.y}, ${p2.x} ${p2.y}"
      stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.85"/>`);
  });
  if (link) {
    const a = graph.nodes.find(n => n.id === link.from);
    if (a) {
      const p1 = portPos(a, "out");
      parts.push(`<path d="M ${p1.x} ${p1.y} L ${link.x} ${link.y}" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4 3"/>`);
    }
  }
  svg.innerHTML = parts.join("");
}

function render() {
  nodesEl.innerHTML = "";
  graph.nodes.forEach(n => {
    const el = document.createElement("div");
    el.className = "node" + (selected === n.id ? " selected" : "");
    el.dataset.id = n.id;
    el.style.left = (n.x + camera.x) + "px";
    el.style.top = (n.y + camera.y) + "px";
    const col = TYPES[n.type]?.color || "#64748b";
    const d = n.data || {};
    let sub = d.model || d.maker || d.tier || d.text || d.commands?.join(" ") || "";
    if (typeof sub === "string" && sub.length > 28) sub = sub.slice(0, 26) + "…";
    el.innerHTML = `
      <div class="hd" style="background:${col}33;border-bottom:1px solid ${col}55">
        <span>${esc(d.label || TYPES[n.type]?.label || n.type)}</span>
        <span style="opacity:.6;font-weight:400;font-size:10px">${esc(n.type)}</span>
      </div>
      <div class="bd">${esc(sub || "—")}</div>
      ${n.type !== "goal" ? '<div class="port in" data-port="in"></div>' : ""}
      ${n.type !== "output" ? '<div class="port out" data-port="out"></div>' : ""}
    `;
    const hd = el.querySelector(".hd");
    hd.addEventListener("mousedown", ev => {
      if (ev.button !== 0) return;
      select(n.id);
      drag = { id: n.id, ox: ev.clientX - n.x - camera.x, oy: ev.clientY - n.y - camera.y };
    });
    el.addEventListener("mousedown", ev => {
      if (ev.target.classList.contains("port")) return;
      select(n.id);
    });
    const pout = el.querySelector(".port.out");
    if (pout) {
      pout.addEventListener("mousedown", ev => {
        ev.stopPropagation();
        const r = canvasWrap.getBoundingClientRect();
        link = { from: n.id, x: ev.clientX - r.left, y: ev.clientY - r.top };
      });
    }
    const pin = el.querySelector(".port.in");
    if (pin) {
      pin.addEventListener("mouseup", ev => {
        ev.stopPropagation();
        if (link && link.from !== n.id) {
          graph.edges = graph.edges.filter(e => !(e.from === link.from && e.to === n.id));
          graph.edges.push({ id: "e_"+uid().slice(2), from: link.from, to: n.id, kind: "data" });
          link = null;
          saveGraphLayout();
          render();
        }
      });
    }
    nodesEl.appendChild(el);
  });
  requestAnimationFrame(renderEdges);
}

canvasWrap.addEventListener("mousedown", event => {
  if (event.button !== 0 || (event.target !== canvasWrap && event.target !== nodesEl)) return;
  pan = {
    startX: event.clientX, startY: event.clientY,
    cameraX: camera.x, cameraY: camera.y,
  };
  canvasWrap.classList.add("panning");
  event.preventDefault();
});

canvasWrap.addEventListener("wheel", event => {
  camera.x -= event.shiftKey ? event.deltaY : event.deltaX;
  camera.y -= event.shiftKey ? 0 : event.deltaY;
  applyCamera();
  saveGraphLayout();
  event.preventDefault();
}, { passive: false });

window.addEventListener("mousemove", e => {
  const r = canvasWrap.getBoundingClientRect();
  if (pan) {
    camera.x = pan.cameraX + e.clientX - pan.startX;
    camera.y = pan.cameraY + e.clientY - pan.startY;
    applyCamera();
  }
  if (drag) {
    const n = graph.nodes.find(x => x.id === drag.id);
    if (n) {
      n.x = e.clientX - camera.x - drag.ox;
      n.y = e.clientY - camera.y - drag.oy;
      const el = document.querySelector(`.node[data-id="${n.id}"]`);
      if (el) { el.style.left = (n.x + camera.x) + "px"; el.style.top = (n.y + camera.y) + "px"; }
      renderEdges();
    }
  }
  if (link) {
    link.x = e.clientX - r.left;
    link.y = e.clientY - r.top;
    renderEdges();
  }
});
window.addEventListener("mouseup", () => {
  if (drag || pan) saveGraphLayout();
  drag = null;
  pan = null;
  canvasWrap.classList.remove("panning");
  if (link) { link = null; renderEdges(); }
});

document.getElementById("btnDel").onclick = () => {
  if (!selected) return;
  graph.nodes = graph.nodes.filter(n => n.id !== selected);
  graph.edges = graph.edges.filter(e => e.from !== selected && e.to !== selected);
  selected = null;
  saveGraphLayout();
  render();
  document.getElementById("insp").textContent = "Select a node";
};

async function loadServiceGraph(serviceId, announce = true) {
  const id = serviceId || "active";
  saveGraphLayout();
  const response = await fetch(`/api/services/${encodeURIComponent(id)}/graph`);
  const body = await response.json();
  if (!response.ok || body.error) { toast(body.error || `Cannot load ${id}`); return; }
  graph = body;
  const restoredLayout = restoreGraphLayout();
  selected = (body.nodes || []).find(node => node.type === "master")?.id || null;
  document.getElementById("graphTitle").textContent = body.title || "Aether Graph";
  if (body.service_id && [...document.getElementById("servicePreset").options].some(option => option.value === body.service_id)) {
    document.getElementById("servicePreset").value = body.service_id;
  }
  render();
  if (selected) select(selected);
  else document.getElementById("insp").textContent = "Select a node";
  if (!restoredLayout) requestAnimationFrame(() => centerGraph(false));
  if (announce) toast(`Loaded ${body.title || id}`);
}

async function loadServiceChoices() {
  const [body, matrix] = await Promise.all([
    fetch("/api/services").then(response => response.ok ? response.json() : {}).catch(() => ({})),
    fetch("/api/matrix").then(response => response.ok ? response.json() : {}).catch(() => ({})),
  ]);
  const select = document.getElementById("servicePreset");
  const active = document.createElement("option"); active.value = "active"; active.textContent = "Active preset";
  select.replaceChildren(active, ...(body.services || []).map(service => {
    const option = document.createElement("option"); option.value = service.id; option.textContent = service.label || service.id; return option;
  }));
  liveChoices.models = Object.entries(matrix.models || {})
    .filter(([, model]) => model.available)
    .map(([alias, model]) => ({ alias, ...model }))
    .sort((a, b) => a.alias.localeCompare(b.alias));
  liveChoices.agents = (body.services || []).flatMap(service =>
    (service.agents || []).filter(agent => agent.available).map(agent => ({
      ...agent, service_id: service.id, service_label: service.label || service.id,
      ref: `${service.id}:${agent.id}`,
    }))
  );
  liveChoices.roles = [...new Set(liveChoices.agents.map(agent => agent.role).filter(Boolean))].sort();
}

document.getElementById("btnActive").onclick = () => loadServiceGraph(document.getElementById("servicePreset").value);
document.getElementById("servicePreset").onchange = () => loadServiceGraph(document.getElementById("servicePreset").value);
document.getElementById("btnCenter").onclick = () => centerGraph();

document.getElementById("btnAuto").onclick = async () => {
  const j = await fetch("/api/graphs/auto-connect", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ graph }),
  }).then(r => r.json());
  if (j.nodes) graph.nodes = j.nodes;
  if (j.edges) graph.edges = j.edges;
  saveGraphLayout();
  render();
  toast("Auto-connected · " + (j.practices || []).length + " practices");
};

document.getElementById("btnTemplate").onclick = async () => {
  const j = await fetch("/api/graphs/template").then(r => r.json());
  graph = j;
  restoreGraphLayout();
  selected = null;
  render();
  toast("Best-practice template loaded");
};

document.getElementById("btnFromPipe").onclick = async () => {
  const id = prompt("Pipeline id (e.g. research-code-test)", "research-code-test");
  if (!id) return;
  const j = await fetch("/api/graphs/from-pipeline", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pipeline_id: id }),
  }).then(r => r.json());
  if (j.error) { toast(j.error); return; }
  graph = j;
  restoreGraphLayout();
  render();
  toast("Loaded pipeline " + id);
};

document.getElementById("btnSave").onclick = async () => {
  const j = await fetch("/api/graphs", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(graph),
  }).then(r => r.json());
  if (j.id) graph.id = j.id;
  saveGraphLayout();
  toast("Saved " + (j.id || ""));
};

document.getElementById("btnPlan").onclick = async () => {
  const j = await fetch("/api/graphs/plan", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ graph, goal: (graph.nodes.find(n => n.type === "goal") || {}).data?.text || "" }),
  }).then(r => r.json());
  document.getElementById("planOut").textContent = (j.flow || "") + "\n" + JSON.stringify(j.stages_resolved || j, null, 2).slice(0, 2500);
  toast("Models resolved for nodes");
};

document.getElementById("btnToPipe").onclick = async () => {
  const j = await fetch("/api/graphs/to-pipeline", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ graph }),
  }).then(r => r.json());
  const blob = new Blob([JSON.stringify(j, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (j.id || "graph") + ".aether-pipeline.json";
  a.click();
  toast("Pipeline JSON downloaded");
};

// Load the requested or currently active capability-resolved service tree.
const requestedService = new URLSearchParams(location.search).get("service") || "active";
loadServiceChoices().then(() => {
  if ([...document.getElementById("servicePreset").options].some(option => option.value === requestedService)) {
    document.getElementById("servicePreset").value = requestedService;
  }
  return loadServiceGraph(requestedService, false);
}).catch(() => render());
window.addEventListener("beforeunload", saveGraphLayout);
  </script>
</body>
</html>
