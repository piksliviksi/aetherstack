name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode-release-gate:
    name: VSIX gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: integrations/vscode/package.json
      - name: Test extension source
        run: npm --prefix integrations/vscode test
      - name: Test CLI source
        run: npm --prefix integrations/cli test
      - name: Validate Unix startup scripts
        if: runner.os != 'Windows'
        shell: bash
        run: find . -maxdepth 3 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Validate Windows startup scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error $_.Message } }
          }
          if ($failed) { exit 1 }
      - name: Verify release identity
        run: npm --prefix integrations/vscode run verify:release
      - name: Package VSIX
        run: npm --prefix integrations/vscode run package:vsix
      - name: Inspect packaged VSIX
        run: npm --prefix integrations/vscode run verify:vsix
      - name: Package and inspect installable runtime
        run: npm --prefix integrations/vscode run package:runtime && npm --prefix integrations/vscode run verify:runtime
      - name: Retain verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: aetherstack-vsix-${{ runner.os }}
          path: dist/aetherstack-*.vsix
          if-no-files-found: error
      - name: Retain verified runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: aetherstack-runtime-${{ runner.os }}
          path: |
            dist/aetherstack-runtime-*.tar.gz
            dist/aetherstack-runtime-*.tar.gz.sha256
          if-no-files-found: error

  runtime-unit:
    name: Runtime unit and Compose checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            aether-hub/requirements.txt
            project-engine/requirements.txt
      - name: Install test dependencies
        run: python -m pip install pytest -r aether-hub/requirements.txt -r project-engine/requirements.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Validate Compose model
        if: runner.os == 'Linux'
        run: docker compose --env-file .env.example config --quiet
