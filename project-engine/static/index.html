<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AetherStack · Engine</title>
  <style>
    :root {
      --bg: #070a0f;
      --panel: #0c1118;
      --border: #1a2535;
      --text: #c8d6e5;
      --dim: #5a6f88;
      --green: #3dd68c;
      --amber: #e6b84d;
      --red: #f07178;
      --cyan: #5ccfe6;
      --accent: #7aa2f7;
      --glow: rgba(61, 214, 140, 0.12);
      --font: "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, ui-monospace, monospace;
      --radius: 6px;
      --scan: 0;
    }
    html.theme-phosphor {
      --bg: #020804;
      --panel: #041208;
      --border: #0d2a18;
      --text: #9ef0b8;
      --dim: #3d7a54;
      --green: #39ff88;
      --amber: #c8e06a;
      --red: #ff6b6b;
      --cyan: #6dffb0;
      --accent: #39ff88;
      --glow: rgba(57, 255, 136, 0.15);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 12.5px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, calc(0.04 + var(--scan) * 0.04)) 3px
      );
      z-index: 50;
    }
    /* layout */
    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
      padding: 0.45rem 0.7rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .logo {
      color: var(--green);
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .logo span { color: var(--dim); font-weight: 400; }
    .pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 1.4s infinite;
    }
    @keyframes blink { 50% { opacity: 0.35; } }
    .tabs { display: flex; gap: 2px; margin-left: 0.25rem; }
    .tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dim);
      padding: 0.25rem 0.55rem;
      border-radius: var(--radius);
      cursor: pointer;
      font: inherit;
    }
    .tab.on { color: var(--green); border-color: var(--green); background: var(--glow); }
    .grow { flex: 1; min-width: 4px; }
    .path-row {
      display: flex; gap: 0.35rem; align-items: center; flex: 1 1 220px; min-width: 160px;
    }
    input, button, select {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.28rem 0.5rem;
    }
    input:focus, button:focus { outline: 1px solid var(--accent); }
    input[type=text] { flex: 1; min-width: 0; }
    input[type=password] { width: 110px; }
    button {
      cursor: pointer;
      color: var(--cyan);
      white-space: nowrap;
    }
    button.primary { color: var(--bg); background: var(--green); border-color: var(--green); font-weight: 600; }
    button:hover { filter: brightness(1.1); }
    button:active { transform: translateY(1px); }
    /* views */
    .views { position: relative; overflow: hidden; min-height: 0; }
    .view { display: none; height: 100%; overflow: auto; padding: 0.55rem 0.7rem 0.8rem; }
    .view.on { display: block; }
    /* compact metrics */
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.45rem;
      margin-bottom: 0.55rem;
    }
    @media (max-width: 820px) {
      .metrics { grid-template-columns: repeat(2, 1fr); }
    }
    .m {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.45rem 0.55rem;
      position: relative;
      overflow: hidden;
    }
    .m::after {
      content: "";
      position: absolute; left: 0; bottom: 0; height: 2px;
      width: var(--p, 0%);
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      transition: width 0.35s ease;
    }
    .m.warn::after { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .m.bad::after { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .m .k { color: var(--dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .m .v { font-size: 1.15rem; color: var(--green); font-weight: 700; margin: 0.1rem 0; }
    .m .s { color: var(--dim); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
    }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.6rem;
      min-height: 0;
    }
    .panel h2 {
      margin: 0 0 0.4rem;
      font-size: 0.72rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th, td { text-align: left; padding: 0.22rem 0.3rem; border-bottom: 1px solid var(--border); }
    th { color: var(--dim); font-weight: 500; }
    code, .mono { font-family: var(--font); }
    code {
      background: var(--bg);
      padding: 0.05rem 0.25rem;
      border-radius: 3px;
      color: var(--cyan);
      font-size: 0.78rem;
    }
    .tag {
      display: inline-block;
      font-size: 0.65rem;
      padding: 0 0.3rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--dim);
    }
    .tag.ok { color: var(--green); border-color: var(--green); }
    .tag.warn { color: var(--amber); border-color: var(--amber); }
    .tag.err { color: var(--red); border-color: var(--red); }
    ul.tips { margin: 0; padding-left: 1rem; }
    ul.tips li { margin: 0.25rem 0; }
    .muted { color: var(--dim); }
    .err { color: var(--red); }
    /* terminal */
    #termView {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 0;
      overflow: hidden;
    }
    #termView.on { display: flex; }
    #termOut {
      flex: 1;
      overflow: auto;
      padding: 0.55rem 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
      background:
        radial-gradient(ellipse at top, rgba(61, 214, 140, 0.04), transparent 55%),
        var(--bg);
    }
    #termOut .line { margin: 0; }
    #termOut .ok { color: var(--green); }
    #termOut .info { color: var(--cyan); }
    #termOut .warn { color: var(--amber); }
    #termOut .err { color: var(--red); }
    #termOut .dim { color: var(--dim); }
    #termOut .prompt { color: var(--accent); }
    .term-in {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.65rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .term-in .ps { color: var(--green); user-select: none; }
    .term-in input {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 0.2rem 0;
      caret-color: var(--green);
    }
    .term-in input:focus { outline: none; }
    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      padding: 0.28rem 0.7rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
      color: var(--dim);
      font-size: 0.7rem;
    }
    footer b { color: var(--text); font-weight: 500; }
    .glitch { animation: glitch 0.35s steps(2) 2; }
    @keyframes glitch {
      0% { transform: translate(0); filter: none; }
      25% { transform: translate(-2px, 1px); filter: hue-rotate(40deg); }
      50% { transform: translate(2px, -1px); }
      100% { transform: translate(0); }
    }
    #matrix {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: #000;
      opacity: 0.92;
    }
    #matrix.on { display: block; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="shell">
    <header>
      <div class="pulse" title="live"></div>
      <div class="logo">AETHER<span>/engine</span></div>
      <div class="tabs">
        <button class="tab on" data-view="dash" type="button">dash</button>
        <button class="tab" data-view="term" type="button">term</button>
      </div>
      <div class="grow"></div>
      <div class="path-row">
        <span class="muted">path</span>
        <input id="project" type="text" placeholder="project path (under allowed roots)" spellcheck="false" />
        <button class="primary" id="scan" type="button">scan</button>
        <button id="refresh" type="button">live</button>
      </div>
      <input id="token" type="password" placeholder="token" title="X-Aether-Token if required" autocomplete="off" />
      <button id="theme" type="button" title="Toggle phosphor CRT">φ</button>
    </header>

    <div class="views">
      <div id="dashView" class="view on">
        <div class="metrics">
          <div class="m" id="cpuM"><div class="k">cpu</div><div class="v" id="cpuPct">—</div><div class="s" id="cpuMeta">…</div></div>
          <div class="m" id="memM"><div class="k">mem</div><div class="v" id="memPct">—</div><div class="s" id="memMeta">…</div></div>
          <div class="m" id="dioM"><div class="k">disk i/o</div><div class="v" id="dioV">—</div><div class="s" id="dioMeta">MB/s r · w</div></div>
          <div class="m" id="gpuM"><div class="k">gpu</div><div class="v" id="gpuV">—</div><div class="s" id="gpuMeta">…</div></div>
        </div>
        <div class="grid2">
          <section class="panel">
            <h2>volumes</h2>
            <table><thead><tr><th>mount</th><th>used</th><th>free</th><th>%</th></tr></thead>
            <tbody id="diskBody"></tbody></table>
          </section>
          <section class="panel">
            <h2>installations</h2>
            <div id="sysBox" class="muted">loading…</div>
          </section>
          <section class="panel" style="grid-column:1/-1">
            <h2>project impact</h2>
            <div id="projBox" class="muted">set path → scan · only allowed roots (cwd · home · repo · --project)</div>
          </section>
        </div>
      </div>

      <div id="termView">
        <div id="termOut" aria-live="polite"></div>
        <div class="term-in">
          <span class="ps">aether&gt;</span>
          <input id="termInput" type="text" autocomplete="off" spellcheck="false" placeholder="help · live · scan · roots · matrix · neofetch" />
        </div>
      </div>
    </div>

    <footer>
      <span>status <b id="stOk">…</b></span>
      <span>auth <b id="stAuth">…</b></span>
      <span>tick <b id="stTick">4s</b></span>
      <span>uptime <b id="stUp">0s</b></span>
      <span class="grow"></span>
      <span id="stHint" class="muted">term: help · dash: compact · φ phosphor</span>
    </footer>
  </div>

  <script>
    /* injected by server.py — never a real secret */
    const TOKEN_REQUIRED = __AETHER_TOKEN_REQUIRED__;
    const ALLOWED_ROOTS = __AETHER_ALLOWED_ROOTS__;

    const $ = (id) => document.getElementById(id);
    const boot = Date.now();
    let hist = [];
    let histIdx = -1;
    let matrixRAF = 0;

    // token from URL or session
    const params = new URLSearchParams(location.search);
    if (params.get("project") || params.get("path")) {
      $("project").value = params.get("project") || params.get("path");
    }
    if (params.get("token")) {
      sessionStorage.setItem("aether_engine_token", params.get("token"));
    }
    $("token").value = sessionStorage.getItem("aether_engine_token") || "";
    $("token").addEventListener("change", () => {
      sessionStorage.setItem("aether_engine_token", $("token").value.trim());
    });

    function token() {
      return ($("token").value || sessionStorage.getItem("aether_engine_token") || "").trim();
    }

    function apiHeaders() {
      const h = {};
      const t = token();
      if (t) h["X-Aether-Token"] = t;
      return h;
    }

    async function api(path) {
      const r = await fetch(path, { headers: apiHeaders(), cache: "no-store" });
      const j = await r.json().catch(() => ({ error: "bad json" }));
      if (!r.ok) {
        const err = new Error(j.error || r.statusText || String(r.status));
        err.status = r.status;
        err.body = j;
        throw err;
      }
      return j;
    }

    function setMeter(el, pct) {
      const p = Math.min(100, Math.max(0, pct || 0));
      el.style.setProperty("--p", p + "%");
      el.classList.remove("warn", "bad");
      if (p >= 90) el.classList.add("bad");
      else if (p >= 75) el.classList.add("warn");
    }

    function fmt(n, d = 1) {
      return n == null || Number.isNaN(n) ? "—" : Number(n).toFixed(d);
    }

    async function loadLive() {
      const j = await api("/api/live");
      const cpu = j.cpu?.percent;
      $("cpuPct").textContent = cpu != null ? fmt(cpu) + "%" : "n/a";
      setMeter($("cpuM"), cpu);
      $("cpuMeta").textContent = `${j.cpu?.count_logical ?? "?"} thr · ${j.backend || "?"}`;

      const m = j.memory || {};
      $("memPct").textContent = m.percent != null ? fmt(m.percent) + "%" : "n/a";
      setMeter($("memM"), m.percent);
      $("memMeta").textContent = m.used_gb != null
        ? `${fmt(m.used_gb)}/${fmt(m.total_gb)} GB`
        : (m.note || "—");

      const r = j.disk_io?.read_mb_s;
      const w = j.disk_io?.write_mb_s;
      $("dioV").textContent = (r != null || w != null) ? `${fmt(r ?? 0)}↑` : "n/a";
      $("dioMeta").textContent = `r ${fmt(r ?? 0)} · w ${fmt(w ?? 0)} MB/s`;
      setMeter($("dioM"), Math.min(100, ((r || 0) + (w || 0)) * 2));

      const g = j.gpu || [];
      if (!g.length) {
        $("gpuV").textContent = "—";
        $("gpuMeta").textContent = "no telemetry";
        setMeter($("gpuM"), 0);
      } else {
        const g0 = g[0];
        $("gpuV").textContent = g0.util_percent != null ? fmt(g0.util_percent) + "%" : (g0.name || "gpu").slice(0, 12);
        $("gpuMeta").textContent = [
          g0.name || g0.vendor,
          g0.mem_used_mb != null ? `${g0.mem_used_mb}/${g0.mem_total_mb} MB` : null,
        ].filter(Boolean).join(" · ").slice(0, 48);
        setMeter($("gpuM"), g0.util_percent || 0);
      }

      const tb = $("diskBody");
      tb.innerHTML = "";
      (j.disks || []).slice(0, 8).forEach((d) => {
        const tr = document.createElement("tr");
        const pct = d.percent ?? 0;
        tr.innerHTML = `<td><code>${d.mount || d.device || "?"}</code></td>
          <td>${fmt(d.used_gb)}G</td><td>${fmt(d.free_gb)}G</td>
          <td style="color:${pct >= 90 ? "var(--red)" : pct >= 75 ? "var(--amber)" : "var(--green)"}">${fmt(pct, 0)}%</td>`;
        tb.appendChild(tr);
      });
      $("stOk").textContent = "ok";
      $("stOk").style.color = "var(--green)";
      return j;
    }

    async function loadSystem() {
      const j = await api("/api/system");
      let html = `<div class="muted" style="margin-bottom:0.35rem">${(j.os || "").slice(0, 80)}</div>`;
      html += `<table><tbody>`;
      (j.installations || []).slice(0, 14).forEach((i) => {
        html += `<tr><td><b>${i.name || "?"}</b></td><td class="muted">${i.version || ""}</td>
          <td>${i.size_gb != null ? i.size_gb + "G" : ""}</td>
          <td><code>${(i.path || "").slice(0, 42)}</code></td></tr>`;
      });
      html += `</tbody></table>`;
      if (j.paths?.length) {
        html += `<div class="muted" style="margin-top:0.4rem">heavy paths</div><table><tbody>`;
        j.paths.slice(0, 8).forEach((p) => {
          html += `<tr><td class="tag">${p.kind}</td><td><code>${p.path}</code></td><td>${p.size_gb ?? "—"}G</td></tr>`;
        });
        html += `</tbody></table>`;
      }
      $("sysBox").innerHTML = html;
      return j;
    }

    async function loadProject() {
      const path = $("project").value.trim();
      if (!path) {
        $("projBox").innerHTML = `<span class="muted">set path → scan</span>`;
        return null;
      }
      $("projBox").textContent = "scanning…";
      try {
        const j = await api("/api/project?path=" + encodeURIComponent(path));
        let html = `<div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:baseline;margin-bottom:0.35rem">
          <span style="font-size:1.25rem;color:var(--green);font-weight:700">${j.total_gb ?? "?"} GB</span>
          <span class="muted">~${j.file_count_approx} files · reclaim ~${j.reclaimable_safe_gb ?? 0} GB</span>
          <code>${j.path}</code>
        </div>`;
        html += `<table><thead><tr><th>name</th><th>gb</th><th></th></tr></thead><tbody>`;
        (j.top_levels || []).slice(0, 16).forEach((t) => {
          html += `<tr><td>${t.name}</td><td>${t.size_gb ?? "—"}</td>
            <td>${t.heavy ? '<span class="tag warn">heavy</span>' : ""}</td></tr>`;
        });
        html += `</tbody></table>`;
        if (j.suggestions?.length) {
          html += `<div class="muted" style="margin-top:0.4rem">optimize (manual)</div><ul class="tips">`;
          j.suggestions.slice(0, 8).forEach((s) => {
            html += `<li><span class="tag ${s.severity === "safe" ? "ok" : s.severity || ""}">${s.severity || "tip"}</span>
              <b>${s.action}</b> <span class="muted">${s.why || ""}</span>
              ${s.command ? `<div><code>${s.command}</code></div>` : ""}</li>`;
          });
          html += `</ul>`;
        }
        $("projBox").innerHTML = html;
        return j;
      } catch (e) {
        $("projBox").innerHTML = `<span class="err">${e.message}</span>`;
        document.body.classList.add("glitch");
        setTimeout(() => document.body.classList.remove("glitch"), 400);
        throw e;
      }
    }

    /* ── terminal ── */
    function tprint(text, cls = "") {
      const el = document.createElement("div");
      el.className = "line" + (cls ? " " + cls : "");
      el.textContent = text;
      $("termOut").appendChild(el);
      $("termOut").scrollTop = $("termOut").scrollHeight;
    }
    function thtml(html) {
      const el = document.createElement("div");
      el.className = "line";
      el.innerHTML = html;
      $("termOut").appendChild(el);
      $("termOut").scrollTop = $("termOut").scrollHeight;
    }

    const BANNER = `
   ▄▄▄       ▓█████▄▄▄█████▓ ██░ ██ ▓█████  ██▀███
  ▒████▄     ▓█   ▀▓  ██▒ ▓▒▓██░ ██▒▓█   ▀ ▓██ ▒ ██▒
  ▒██  ▀█▄   ▒███  ▒ ▓██░ ▒░▒██▀▀██░▒███   ▓██ ░▄█ ▒
  ░██▄▄▄▄██  ▒▓█  ▄░ ▓██▓ ░ ░▓█ ░██ ▒▓█  ▄ ▒██▀▀█▄
   ▓█   ▓██▒▒░▒████  ▒██▒ ░ ░▓█▒░██▓░▒████▒░██▓ ▒██▒
   ▒▒   ▓▒█░░░░ ▒░   ▒ ░░    ▒ ░░▒░▒░░ ▒░ ░░ ▒▓ ░▒▓░
 engine · local telemetry · path-gated scans
`;

    function bootTerm() {
      $("termOut").innerHTML = "";
      tprint(BANNER.trimEnd(), "ok");
      tprint("type help — or press ↑ for history", "dim");
      if (TOKEN_REQUIRED) tprint("auth required: set token field or ?token=", "warn");
      tprint("allowed roots:", "info");
      (ALLOWED_ROOTS || []).forEach((r) => tprint("  · " + r, "dim"));
    }

    async function runCmd(line) {
      const raw = line.trim();
      if (!raw) return;
      tprint("aether> " + raw, "prompt");
      const parts = raw.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
      const cmd = (parts[0] || "").toLowerCase();
      const arg = parts.slice(1).join(" ").replace(/^"|"$/g, "");

      try {
        switch (cmd) {
          case "help":
          case "?":
            tprint("commands:", "info");
            [
              "live                 live cpu/mem/io/gpu",
              "sys | system         installations footprint",
              "scan [path]          project disk impact",
              "full [path]          combined report",
              "roots                allowed scan roots",
              "health               engine health",
              "neofetch | about     soft flex",
              "theme                toggle phosphor CRT",
              "matrix [off]         digital rain (Esc exits)",
              "clear | cls          clear terminal",
              "dash                 switch to dashboard",
              "whoami               local identity joke",
              "sudo ...             nice try",
              "exit | quit          (stays open — this is a browser)",
            ].forEach((l) => tprint("  " + l, "dim"));
            break;
          case "clear":
          case "cls":
            $("termOut").innerHTML = "";
            break;
          case "dash":
          case "dashboard":
            setView("dash");
            tprint("→ dash", "ok");
            break;
          case "theme":
          case "phosphor":
            toggleTheme();
            tprint("theme toggled", "ok");
            break;
          case "matrix":
            if (arg === "off") stopMatrix();
            else startMatrix();
            break;
          case "whoami":
            tprint((navigator.userAgent || "agent").slice(0, 100), "dim");
            tprint("you are: local operator · privilege: lab", "ok");
            break;
          case "sudo":
            tprint("aether-engine: permission denied (and slightly amused)", "warn");
            tprint("hint: this process already runs as you", "dim");
            break;
          case "exit":
          case "quit":
            tprint("can't close the browser from here. try matrix for drama.", "warn");
            break;
          case "neofetch":
          case "about":
          case "fetch": {
            const h = await api("/api/health").catch(() => ({ ok: false }));
            tprint("          .", "ok");
            tprint("         / \\     aetherstack-project-engine", "ok");
            tprint("        /   \\    " + (h.service || "engine"), "ok");
            tprint("       /_____\\   auth: " + (h.auth_required ? "on" : "off"), "ok");
            tprint("      (  · ·  )  host: " + location.host, "cyan");
            tprint("       \\  ~  /   uptime: " + uptimeStr(), "dim");
            tprint("        '---'    roots: " + (ALLOWED_ROOTS || []).length, "dim");
            break;
          }
          case "health": {
            const j = await api("/api/health");
            tprint(JSON.stringify(j, null, 2), "ok");
            break;
          }
          case "roots": {
            const j = await api("/api/roots");
            (j.allowed_roots || []).forEach((r) => tprint(r, "info"));
            tprint("auth_required=" + j.auth_required, "dim");
            break;
          }
          case "live": {
            const j = await api("/api/live");
            tprint(`cpu ${fmt(j.cpu?.percent)}%  mem ${fmt(j.memory?.percent)}%  backend ${j.backend}`, "ok");
            (j.disks || []).slice(0, 6).forEach((d) =>
              tprint(`  ${d.mount || d.device}  ${fmt(d.percent, 0)}% used  free ${fmt(d.free_gb)}G`, "dim")
            );
            (j.gpu || []).forEach((g) =>
              tprint(`  gpu ${g.name || g.vendor} util ${g.util_percent ?? "?"} vram ${g.mem_used_mb ?? "?"}`, "info")
            );
            await loadLive().catch(() => {});
            break;
          }
          case "sys":
          case "system": {
            const j = await api("/api/system");
            tprint((j.os || "").slice(0, 120), "dim");
            (j.installations || []).slice(0, 12).forEach((i) =>
              tprint(`  ${i.name}${i.version ? " " + i.version : ""}${i.size_gb != null ? " · " + i.size_gb + "G" : ""}`, "info")
            );
            await loadSystem().catch(() => {});
            break;
          }
          case "scan": {
            const p = arg || $("project").value.trim();
            if (!p) { tprint("usage: scan <path>", "warn"); break; }
            $("project").value = p;
            tprint("scanning " + p + " …", "dim");
            const j = await api("/api/project?path=" + encodeURIComponent(p));
            tprint(`${j.total_gb} GB · ~${j.file_count_approx} files · reclaim ${j.reclaimable_safe_gb} GB`, "ok");
            (j.top_levels || []).slice(0, 12).forEach((t) =>
              tprint(`  ${String(t.size_gb ?? 0).padStart(7)}G  ${t.name}${t.heavy ? "  [heavy]" : ""}`, "dim")
            );
            (j.suggestions || []).slice(0, 5).forEach((s) => tprint("  * " + s.action, "warn"));
            await loadProject().catch(() => {});
            break;
          }
          case "full": {
            const p = arg || $("project").value.trim();
            const q = p ? "?path=" + encodeURIComponent(p) : "";
            tprint("full report…", "dim");
            const j = await api("/api/full" + q);
            tprint("live+system" + (j.project ? "+project" : " (no project)"), "ok");
            tprint(JSON.stringify({
              live_cpu: j.live?.cpu?.percent,
              mem: j.live?.memory?.percent,
              project_gb: j.project?.total_gb,
              installs: (j.system?.installations || []).length,
            }, null, 2), "info");
            break;
          }
          case "konami":
            tprint("↑↑↓↓←→←→BA already wired — try the pad", "info");
            break;
          default:
            tprint("unknown: " + cmd + "  (help)", "err");
            document.body.classList.add("glitch");
            setTimeout(() => document.body.classList.remove("glitch"), 350);
        }
      } catch (e) {
        tprint("error: " + e.message, "err");
        if (e.status === 401) tprint("set token field (AETHERSTACK_ENGINE_TOKEN)", "warn");
      }
    }

    $("termInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const v = $("termInput").value;
        hist.push(v);
        histIdx = hist.length;
        $("termInput").value = "";
        runCmd(v);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!hist.length) return;
        histIdx = Math.max(0, histIdx - 1);
        $("termInput").value = hist[histIdx] || "";
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        histIdx = Math.min(hist.length, histIdx + 1);
        $("termInput").value = hist[histIdx] || "";
      }
    });

    /* views */
    function setView(name) {
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.view === name));
      $("dashView").classList.toggle("on", name === "dash");
      $("termView").classList.toggle("on", name === "term");
      if (name === "term") {
        if (!$("termOut").childElementCount) bootTerm();
        $("termInput").focus();
      }
      localStorage.setItem("aether_engine_view", name);
    }
    document.querySelectorAll(".tab").forEach((t) =>
      t.addEventListener("click", () => setView(t.dataset.view))
    );

    function toggleTheme() {
      document.documentElement.classList.toggle("theme-phosphor");
      const on = document.documentElement.classList.contains("theme-phosphor");
      localStorage.setItem("aether_engine_theme", on ? "phosphor" : "default");
      document.documentElement.style.setProperty("--scan", on ? "1" : "0");
    }
    $("theme").onclick = toggleTheme;
    if (localStorage.getItem("aether_engine_theme") === "phosphor") {
      document.documentElement.classList.add("theme-phosphor");
      document.documentElement.style.setProperty("--scan", "1");
    }

    /* matrix rain quirk */
    function startMatrix() {
      const c = $("matrix");
      c.classList.add("on");
      const ctx = c.getContext("2d");
      const resize = () => { c.width = innerWidth; c.height = innerHeight; };
      resize();
      const chars = "アイウエオ01AETHERSTACK$#";
      const font = 14;
      let cols = Math.floor(c.width / font);
      let drops = Array(cols).fill(1);
      const draw = () => {
        ctx.fillStyle = "rgba(0,0,0,0.08)";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = "#3dd68c";
        ctx.font = font + "px monospace";
        for (let i = 0; i < drops.length; i++) {
          const ch = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(ch, i * font, drops[i] * font);
          if (drops[i] * font > c.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
        matrixRAF = requestAnimationFrame(draw);
      };
      window.addEventListener("resize", () => {
        resize();
        cols = Math.floor(c.width / font);
        drops = Array(cols).fill(1);
      });
      draw();
      tprint("matrix on — Esc to exit", "ok");
    }
    function stopMatrix() {
      cancelAnimationFrame(matrixRAF);
      $("matrix").classList.remove("on");
      tprint("matrix off", "dim");
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") stopMatrix();
    });

    /* konami → matrix */
    const seq = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
    let seqI = 0;
    document.addEventListener("keydown", (e) => {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (k === seq[seqI] || (seq[seqI].length === 1 && k === seq[seqI])) {
        seqI++;
        if (seqI === seq.length) { seqI = 0; startMatrix(); }
      } else seqI = 0;
    });

    function uptimeStr() {
      const s = Math.floor((Date.now() - boot) / 1000);
      if (s < 60) return s + "s";
      if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
      return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
    }
    setInterval(() => { $("stUp").textContent = uptimeStr(); }, 1000);

    $("refresh").onclick = () => loadLive().catch((e) => {
      $("stOk").textContent = "err";
      $("stOk").style.color = "var(--red)";
      alert(e.message);
    });
    $("scan").onclick = () => loadProject().catch(() => {});

    // health / auth banner
    api("/api/health")
      .then((h) => {
        $("stAuth").textContent = h.auth_required ? "required" : "off";
        $("stAuth").style.color = h.auth_required ? "var(--amber)" : "var(--dim)";
      })
      .catch(() => {
        $("stAuth").textContent = "down";
        $("stAuth").style.color = "var(--red)";
      });

    // restore view
    const pref = localStorage.getItem("aether_engine_view") || "dash";
    setView(pref === "term" ? "term" : "dash");
    if (pref === "term") bootTerm();

    loadLive().catch((e) => {
      $("stOk").textContent = e.status === 401 ? "401" : "err";
      $("stOk").style.color = "var(--red)";
      $("stHint").textContent = e.status === 401 ? "enter token · reload" : e.message;
    });
    loadSystem().catch(() => {});
    if ($("project").value) loadProject().catch(() => {});
    setInterval(() => loadLive().catch(() => {}), 4000);
  </script>
</body>
</html>
