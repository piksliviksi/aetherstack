<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}} 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
  <title>AetherStack Chat</title>
  <style>
    * { box-sizing: border-box; }
    body, textarea, input, button, select {
      font-family: var(--vscode-editor-font-family, 'SF Mono', Consolas, monospace);
      font-size: var(--vscode-editor-font-size, 13px);
    }
    body { margin: 0; color: var(--vscode-foreground); background: var(--vscode-editor-background); line-height: 1.5; }
    main { width: min(980px, 100%); margin: 0 auto; padding: 14px 16px; display: flex; flex-direction: column; min-height: 100vh; }
    header, .composer-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    header { position: relative; z-index: 5; justify-content: space-between; margin-bottom: 10px; }
    .header-actions { position: relative; display: flex; gap: 6px; align-items: center; }
    .brandmark { display: flex; align-items: center; gap: 8px; }
    .ae { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: var(--vscode-button-background); color: var(--vscode-button-foreground); font-weight: 700; font-size: 11px; border-radius: 3px; }
    h1 { margin: 0; font-size: 13px; font-weight: 600; }
    .muted { color: var(--vscode-descriptionForeground); }
    .toolbar, .agents { display: none; }
    select, textarea { color: var(--vscode-input-foreground); background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border); font: inherit; }
    #route { margin: 0 0 8px; min-height: 18px; color: var(--vscode-textLink-foreground); }
    #messages { flex: 1; display: grid; gap: 12px; align-content: start; margin: 4px 0 12px; }
    .message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .message .role { color: var(--vscode-descriptionForeground); }
    .message.user .role::before { content: '› '; }
    .message.assistant .role::before { content: 'AE '; font-weight: 700; }
    .message pre { position: relative; overflow: auto; margin: 6px 0 0; padding: 9px; border-radius: 2px; background: var(--vscode-textCodeBlock-background); }
    .message pre .lang-label { position: absolute; top: 4px; right: 34px; font-size: 10px; color: var(--vscode-descriptionForeground); }
    .message pre .copy-code { position: absolute; top: 2px; right: 4px; padding: 2px 6px; font-size: 10px; }
    .tok-kw { color: var(--vscode-symbolIcon-keywordForeground, #c586c0); }
    .tok-str { color: var(--vscode-symbolIcon-stringForeground, #ce9178); }
    .tok-num { color: var(--vscode-symbolIcon-numberForeground, #b5cea8); }
    table { border-collapse: collapse; margin: 6px 0; }
    th, td { border: 1px solid var(--vscode-panel-border); padding: 3px 8px; text-align: left; }
    blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--vscode-panel-border); color: var(--vscode-descriptionForeground); }
    .message code { font-family: inherit; }
    .message strong { color: var(--vscode-testing-iconPassed); }
    .role { display: block; margin-bottom: 3px; }
    .message { position: relative; }
    .message .msg-actions { position: absolute; top: 0; right: 0; display: none; gap: 4px; }
    .message:hover .msg-actions { display: flex; }
    .message:focus-within .msg-actions { display: flex; }
    .message .msg-actions button { padding: 1px 6px; font-size: 10px; }
    .composer {
      position: relative;
      border: 1px solid var(--vscode-panel-border);
      padding: 2px 10px 8px;
      margin-top: auto;
    }
    .composer legend { padding: 0 6px; color: var(--vscode-descriptionForeground); font-size: 11px; }
    .composer legend button { all: unset; cursor: pointer; }
    .composer legend button:hover, .composer legend button:focus-visible { color: var(--vscode-foreground); text-decoration: underline; }
    .model-picker {
      position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 6px;
      background: var(--vscode-dropdown-background, var(--vscode-editor-background));
      border: 1px solid var(--vscode-panel-border); border-radius: 3px;
      box-shadow: 0 2px 8px rgba(0,0,0,.3); z-index: 10;
    }
    .model-picker-title { padding: 7px 10px 4px; font-size: 11px; color: var(--vscode-descriptionForeground); }
    .model-picker-list { max-height: 240px; overflow: auto; }
    .model-picker-item { display: flex; gap: 6px; align-items: baseline; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
    .model-picker-item .marker { color: var(--vscode-testing-iconPassed); width: 1em; flex: none; }
    .model-picker-item.current { font-weight: 700; }
    .model-picker-item.active, .model-picker-item:hover { background: var(--vscode-list-hoverBackground); }
    .model-picker-help { padding: 4px 10px 7px; font-size: 10px; color: var(--vscode-descriptionForeground); }
    .prompt-row { display: flex; align-items: flex-start; gap: 6px; }
    .prompt-row::before { content: '>'; color: var(--vscode-testing-iconPassed); padding-top: 6px; }
    textarea { flex: 1; width: 100%; min-height: 24px; max-height: 220px; resize: vertical; border: 0; background: transparent; padding: 6px 0; outline: none; }
    textarea:disabled { opacity: .55; cursor: wait; }
    #inference { min-height: 20px; margin: 2px 0; color: var(--vscode-descriptionForeground); display: flex; align-items: center; gap: 7px; }
    #inference.busy::before { content: '◌'; color: var(--vscode-progressBar-background); animation: spin 1s linear infinite; }
    #activeModels { color: var(--vscode-testing-iconPassed); font-weight: 600; }
    button { color: var(--vscode-button-foreground); background: var(--vscode-button-background); border: 1px solid var(--vscode-button-border, transparent); padding: 5px 10px; cursor: pointer; }
    button.secondary { color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 18px; }
    .error { color: var(--vscode-errorForeground); }
    .statusline { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; color: var(--vscode-descriptionForeground); font-size: 11px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .idle-art { display: none; flex: 1 1 55vh; min-height: 280px; width: 100%; align-items: stretch; justify-content: stretch; overflow: hidden; }
    .idle-art pre { width: 100%; height: 100%; margin: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--vscode-descriptionForeground); font-size: clamp(5px, .85vw, 10px); line-height: .9; letter-spacing: 0; text-align: center; opacity: .58; user-select: none; }
    .history-menu { position: absolute; top: calc(100% + 6px); right: 0; width: min(360px, calc(100vw - 32px)); max-height: min(440px, 70vh); overflow-y: auto; padding: 8px; background: var(--vscode-dropdown-background, var(--vscode-editor-background)); border: 1px solid var(--vscode-panel-border); box-shadow: 0 8px 22px rgba(0,0,0,.38); }
    .history-menu[hidden] { display: none; }
    .history-menu.busy { opacity: .6; }
    .history-title { padding: 2px 4px 7px; font-size: 11px; color: var(--vscode-descriptionForeground); }
    .history-empty { padding: 8px 4px; font-size: 12px; color: var(--vscode-descriptionForeground); }
    .history-item { display: flex; justify-content: space-between; gap: 8px; padding: 6px 5px; cursor: pointer; border-radius: 2px; font-size: 12px; }
    .history-item:hover { background: var(--vscode-list-hoverBackground); }
    .history-item > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .del { flex: none; opacity: .5; background: transparent; border: none; padding: 0 2px; color: inherit; font: inherit; cursor: pointer; }
    .history-item .del:hover { opacity: 1; }
    .history-item:focus-visible, .history-item .del:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
    @media (prefers-reduced-motion: reduce) { .idle-art pre { opacity: .42; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brandmark"><span class="ae">AE</span><h1>AetherStack</h1></div>
    <div class="header-actions">
      <button id="newConversation" class="secondary" type="button">New</button>
      <button id="historyMenuButton" class="secondary" type="button" aria-haspopup="true" aria-expanded="false">History</button>
      <button id="refresh" class="secondary" type="button">Refresh</button>
      <button id="advanced" class="secondary" type="button">Advanced</button>
      <div class="history-menu" id="historyMenu" hidden>
        <div class="history-title">Conversations</div>
        <div id="historyList"></div>
      </div>
    </div>
  </header>
  <section class="toolbar">
    <label>Routing<select id="service"></select></label>
    <label>Lean delivery<select id="lean"><option value="off">Off</option><option value="balanced" selected>Balanced</option><option value="strict">Strict</option></select></label>
    <label style="display:flex;align-items:center;min-width:auto"><input id="tokenSaver" type="checkbox"> Prefer lower token cost</label>
  </section>
  <section class="agents"><strong>Dynamic team</strong><div class="muted" id="serviceDescription"></div><div id="activities" class="activities"></div><div id="agents" class="agent-list"></div><details class="graph"><summary>Active preset node graph</summary><div id="serviceGraph" class="graph-flow"></div></details></section>
  <div id="route"></div>
  <div id="messages"></div>
  <div id="idleArt" class="idle-art"><pre id="idleArtPre"></pre></div>
  <fieldset class="composer">
    <legend><button type="button" id="modeLabel" title="Switch preset">auto</button></legend>
    <div id="modelPicker" class="model-picker" hidden>
      <div class="model-picker-title">Select preset</div>
      <div id="modelPickerList" class="model-picker-list" role="listbox"></div>
      <div class="model-picker-help">↑↓ Navigate · Enter Select · Esc Cancel</div>
    </div>
    <div class="prompt-row"><textarea id="prompt" placeholder="Ask anything, or use /research, /plan, /code, /test, /bugfix, /help…"></textarea></div>
    <div id="inference"><span id="activeModels"></span> <span id="activityText"></span></div>
    <div class="composer-actions">
      <span id="status" class="muted"></span>
      <button type="button" id="attachBtn" class="secondary">Attach</button>
      <button type="button" id="cancel" class="secondary" hidden>Stop</button>
      <input type="file" id="attachInput" accept="image/*,.pdf" multiple hidden>
      <span id="attachList"></span>
    </div>
  </fieldset>
  <div class="statusline"><span id="cwdLine"></span><span id="tokenLine"></span></div>
</main>
<script nonce="{{NONCE}}">{{CHAT_RENDER_JS}}</script>
<script nonce="{{NONCE}}">
  const vscode = acquireVsCodeApi();
  const $ = (id) => document.getElementById(id);
  let services = [];
  let activityWords = [];
  let activeServiceId = '';
  let activityTimer = null;
  let showActiveModel = false;
  let historyBusy = false;
  const MAX_ATTACHMENT_BYTES = 8 * 1024 * 1024;
  let pendingAttachments = [];
  const restored = vscode.getState() || {};
  let activeConversationId = typeof restored.conversationId === 'string' ? restored.conversationId : null;
  function renderHistory(items) {
    const rows = items.map((item) => {
      const row = text('div', '', 'history-item');
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.setAttribute('aria-label', `Switch to conversation: ${item.title}`);
      row.append(text('span', item.title));
      const del = text('button', '✕', 'del');
      del.type = 'button';
      del.setAttribute('aria-label', 'Delete conversation');
      del.addEventListener('click', (event) => { event.stopPropagation(); vscode.postMessage({ type: 'deleteConversation', id: item.id }); });
      row.append(del);
      const switchTo = () => { if (!historyBusy) vscode.postMessage({ type: 'switchConversation', id: item.id }); };
      row.addEventListener('click', switchTo);
      row.addEventListener('keydown', (event) => {
        if (event.target !== row) return;
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); switchTo(); }
      });
      return row;
    });
    $('historyList').replaceChildren(...(rows.length ? rows : [text('div', 'No conversations yet.', 'history-empty')]));
  }
  let transcript = Array.isArray(restored.transcript) ? restored.transcript.slice(-40) : [];
  let streamingBox = null;
  let streamingRaw = '';
  function startStreamingMessage() {
    $('idleArt').style.display = 'none';
    $('messages').style.flex = '1';
    streamingRaw = '';
    const box = text('article', '', 'message assistant');
    box.append(text('span', 'AetherStack', 'role'));
    const body = text('div', '');
    box.append(body);
    $('messages').append(box);
    streamingBox = box;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function appendStreamingDelta(chunk) {
    if (!streamingBox) startStreamingMessage();
    streamingRaw += chunk;
    const body = streamingBox.children[1];
    body.replaceChildren();
    appendRichText(body, streamingRaw);
    streamingBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function finishStreamingMessage() {
    if (streamingBox) streamingBox.remove();
    streamingBox = null;
    streamingRaw = '';
  }
  const text = (tag, value, className) =>{ const node = document.createElement(tag); node.textContent = value == null ? '' : String(value); if (className) node.className = className; return node; };
  function selected() { return services.find((item) => item.id === ($('service').value === 'auto' ? activeServiceId : $('service').value)); }
  function graphNode(agent, label) { const node = text('div', '', 'graph-node'); node.append(text('strong', label || (agent && agent.label) || 'Stage')); if (agent) node.append(text('code', agent.model || 'unresolved')); return node; }
  function renderGraph(service) { const agents = (service && service.agents) || []; const lead = agents.find((a) => a.role === 'mastermind'); const reviewer = agents.find((a) => a.role === 'supervisor'); const workers = agents.filter((a) => a.role === 'worker'); const flow = $('serviceGraph'); flow.replaceChildren(graphNode(lead, (lead && lead.label) || 'Lead'), text('div', '↓', 'graph-arrow')); const row = text('div', '', 'graph-row'); row.append(...(workers.length ? workers.map((agent) => graphNode(agent, agent.label)) : [graphNode(null, 'Workers resolve after task detection')])); flow.append(row, text('div', '↓', 'graph-arrow'), graphNode(reviewer, (reviewer && reviewer.label) || 'Review'), text('div', '↓', 'graph-arrow'), graphNode(lead, 'Synthesis')); }
  function renderTeam() {
    const service = selected();
    $('agents').replaceChildren();
    $('serviceDescription').textContent = service ? service.summary || '' : $('service').value === 'auto' ? 'Describe the current coding stage; AetherStack selects and activates the matching live team.' : 'No service presets are available.';
    $('activities').replaceChildren(...((service && service.activities) || []).map((value) => text('span', value, 'activity')));
    for (const agent of (service && service.agents) || []) {
      const gaps = (agent.missing_capabilities || []).length ? ` · missing ${agent.missing_capabilities.join(', ')}` : '';
      $('agents').append(text('span', `${agent.role}: ${agent.model || 'unresolved'}${agent.backend ? ` (${agent.backend})` : ''}${gaps}`, 'agent'));
    }
    renderGraph(service);
    $('modeLabel').textContent = service ? service.label || service.id : 'auto';
  }
  function rotateActivity() { const enabled = activityWords.filter((item) => item && item.enabled !== false && item.text); $('activityText').textContent = enabled.length ? enabled[Math.floor(Math.random() * enabled.length)].text : 'Combobulating the agent swarm...'; }
  function saveState() { vscode.setState({ transcript: transcript.slice(-40), conversationId: activeConversationId, serviceId: $('service').value || 'auto', activeServiceId }); }
  function setBusy(value) { clearInterval(activityTimer); activityTimer = null; $('cancel').hidden = !value; $('inference').classList.toggle('busy', Boolean(value)); if (value) { rotateActivity(); activityTimer = setInterval(rotateActivity, 1900); } else { $('activityText').textContent = ''; $('activeModels').textContent = ''; } }
  function appendRichText(parent, value) {
    parent.insertAdjacentHTML('beforeend', renderMarkdown(String(value || '')));
    parent.querySelectorAll('pre[data-lang]').forEach((pre) => {
      const lang = pre.getAttribute('data-lang');
      if (lang) pre.appendChild(text('span', lang, 'lang-label'));
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'secondary copy-code'; button.textContent = 'Copy';
      button.addEventListener('click', () => navigator.clipboard.writeText(pre.querySelector('code').textContent));
      pre.appendChild(button);
    });
  }
  let messageSeq = 0;
  function addMessage(role, value, detail, persist = true, explicitId, messageAttachments = []) {
    $('idleArt').style.display = 'none';
    $('messages').style.flex = '1';
    const id = explicitId != null ? explicitId : (messageSeq += 1);
    const box = text('article', '', `message ${role}`);
    box.tabIndex = 0;
    box.dataset.msgId = String(id);
    box.append(text('span', role === 'user' ? 'You' : 'AetherStack', 'role'));
    appendRichText(box, value);
    if (detail) box.append(text('div', detail, 'muted'));
    const actions = text('div', '', 'msg-actions');
    const copyBtn = document.createElement('button'); copyBtn.type = 'button'; copyBtn.className = 'secondary'; copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', () => navigator.clipboard.writeText(String(value || '')).catch(() => {}));
    actions.append(copyBtn);
    if (role === 'user') {
      const editBtn = document.createElement('button'); editBtn.type = 'button'; editBtn.className = 'secondary'; editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => editMessage(id));
      actions.append(editBtn);
    } else {
      const regenBtn = document.createElement('button'); regenBtn.type = 'button'; regenBtn.className = 'secondary'; regenBtn.textContent = 'Regenerate';
      regenBtn.addEventListener('click', () => regenerateFrom(id));
      actions.append(regenBtn);
    }
    box.append(actions);
    $('messages').append(box);
    if (persist) { transcript.push({ id, role, value: String(value || ''), detail: String(detail || ''), attachments: messageAttachments }); saveState(); }
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function truncateTranscriptFrom(id) {
    const index = transcript.findIndex((item) => item.id === id);
    if (index === -1) return;
    transcript = transcript.slice(0, index);
    $('messages').replaceChildren();
    transcript.forEach((item) => addMessage(item.role, item.value, item.detail, false, item.id, item.attachments || []));
    if (!transcript.length) { $('idleArt').style.display = 'flex'; $('messages').style.flex = '0'; }
    saveState();
  }
  function editMessage(id) {
    const item = transcript.find((entry) => entry.id === id);
    if (!item) return;
    truncateTranscriptFrom(id);
    $('prompt').value = item.value;
    $('prompt').focus();
  }
  function regenerateFrom(id) {
    const index = transcript.findIndex((item) => item.id === id);
    const prior = index > 0 ? transcript[index - 1] : null;
    if (!prior || prior.role !== 'user') return;
    truncateTranscriptFrom(prior.id);
    $('prompt').value = prior.value;
    pendingAttachments = prior.attachments || [];
    sendPrompt();
  }
  const idleLogoRows = [
    '01110011111', '10001010000', '10001010000', '11111011110',
    '10001010000', '10001010000', '10001011111',
  ];
  const idlePoints = [];
  for (let y = 0; y < idleLogoRows.length; y += 1) {
    for (let x = 0; x < idleLogoRows[y].length; x += 1) {
      if (idleLogoRows[y][x] !== '1') continue;
      for (let sy = 0; sy < 2; sy += 1) for (let sx = 0; sx < 2; sx += 1) {
        for (let z = -3; z <= 3; z += 1) idlePoints.push({ x: (x + sx / 2 - 5.25), y: (3.25 - y - sy / 2), z: z * .42 });
      }
    }
  }
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let idleFrame = 0;
  let idleLastPaint = 0;
  function renderIdleLogo(time = 0) {
    idleFrame = requestAnimationFrame(renderIdleLogo);
    if ($('idleArt').style.display === 'none' || document.hidden || time - idleLastPaint < 45) return;
    idleLastPaint = time;
    const width = Math.max(36, Math.min(132, Math.floor($('idleArt').clientWidth / 6.2)));
    const height = Math.max(18, Math.min(54, Math.floor($('idleArt').clientHeight / 10)));
    const cells = Array(width * height).fill(' ');
    const depths = new Float32Array(width * height); depths.fill(-Infinity);
    const motion = reducedMotion.matches ? 0.65 : time / 1000;
    const ay = reducedMotion.matches ? -.55 : motion * .92;
    const ax = reducedMotion.matches ? .22 : Math.sin(motion * .63) * .48;
    const az = reducedMotion.matches ? 0 : Math.sin(motion * .37) * .18;
    const cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax), cz = Math.cos(az), sz = Math.sin(az);
    const scale = Math.min(width / 15, height / 9) * (reducedMotion.matches ? 1.0 : 1 + Math.sin(motion * 1.7) * .08);
    const shades = '.:-=+*#%@';
    for (const point of idlePoints) {
      const x1 = point.x * cy + point.z * sy;
      const z1 = -point.x * sy + point.z * cy;
      const y1 = point.y * cx - z1 * sx;
      const z2 = point.y * sx + z1 * cx;
      const x2 = x1 * cz - y1 * sz;
      const y2 = x1 * sz + y1 * cz;
      const perspective = 10 / (12 - z2);
      const col = Math.round(width / 2 + x2 * scale * perspective * 1.65);
      const row = Math.round(height / 2 - y2 * scale * perspective);
      if (col < 0 || col >= width || row < 0 || row >= height) continue;
      const index = row * width + col;
      if (z2 <= depths[index]) continue;
      depths[index] = z2;
      const shade = Math.max(0, Math.min(shades.length - 1, Math.round((z2 + 6) / 12 * (shades.length - 1))));
      cells[index] = shades[shade];
    }
    const label = 'A E T H E R S T A C K';
    const labelStart = Math.max(0, Math.floor((width - label.length) / 2));
    const labelRow = Math.min(height - 1, Math.floor(height * .88));
    for (let i = 0; i < label.length && labelStart + i < width; i += 1) cells[labelRow * width + labelStart + i] = label[i];
    const lines = [];
    for (let row = 0; row < height; row += 1) lines.push(cells.slice(row * width, (row + 1) * width).join('').replace(/\s+$/, ''));
    $('idleArtPre').textContent = lines.join('\n');
  }
  idleFrame = requestAnimationFrame(renderIdleLogo);
  (function backfillTranscriptIds() {
    // Legacy transcripts saved before id tracking (commit 5574691) have no id field at all.
    // Mint real ids and persist them into the transcript array itself, not just the DOM.
    let nextId = transcript.reduce((max, item) => Math.max(max, item.id || 0), 0);
    let backfilled = false;
    for (const item of transcript) {
      if (item.id == null) { item.id = ++nextId; backfilled = true; }
    }
    if (backfilled) saveState();
  })();
  transcript.forEach((item) => addMessage(item.role, item.value, item.detail, false, item.id, item.attachments || []));
  messageSeq = transcript.reduce((max, item) => Math.max(max, item.id || 0), 0);
  if (!transcript.length) { $('idleArt').style.display = 'flex'; $('messages').style.flex = '0'; }
  let pickerIndex = -1;
  function pickerOptions() { return [{ id: 'auto', label: 'Auto — analyze my request' }, ...services.map((service) => ({ id: service.id, label: service.label || service.id }))]; }
  function closeModelPicker() { $('modelPicker').hidden = true; }
  function renderModelPicker() {
    const options = pickerOptions();
    const currentId = $('service').value || 'auto';
    $('modelPickerList').replaceChildren(...options.map((option, index) => {
      const current = option.id === currentId;
      const row = text('div', '', `model-picker-item${current ? ' current' : ''}${index === pickerIndex ? ' active' : ''}`);
      row.setAttribute('role', 'option');
      row.append(text('span', current ? '›' : '', 'marker'), text('span', option.label));
      row.addEventListener('click', () => selectModelPickerOption(option.id));
      return row;
    }));
  }
  function openModelPicker() {
    const options = pickerOptions();
    pickerIndex = Math.max(0, options.findIndex((option) => option.id === ($('service').value || 'auto')));
    renderModelPicker();
    $('modelPicker').hidden = false;
  }
  function selectModelPickerOption(id) {
    $('service').value = id;
    activeServiceId = id === 'auto' ? activeServiceId : id;
    renderTeam(); saveState();
    closeModelPicker();
    $('prompt').focus();
  }
  $('modeLabel').addEventListener('click', () => { $('modelPicker').hidden ? openModelPicker() : closeModelPicker(); });
  document.addEventListener('keydown', (event) => {
    if ($('modelPicker').hidden) return;
    const options = pickerOptions();
    if (event.key === 'ArrowDown') { event.preventDefault(); pickerIndex = (pickerIndex + 1) % options.length; renderModelPicker(); }
    else if (event.key === 'ArrowUp') { event.preventDefault(); pickerIndex = (pickerIndex - 1 + options.length) % options.length; renderModelPicker(); }
    else if (event.key === 'Enter') { event.preventDefault(); if (options[pickerIndex]) selectModelPickerOption(options[pickerIndex].id); }
    else if (event.key === 'Escape') { event.preventDefault(); closeModelPicker(); $('prompt').focus(); }
  });
  document.addEventListener('click', (event) => {
    if (!$('modelPicker').hidden && !$('modelPicker').contains(event.target) && event.target !== $('modeLabel')) closeModelPicker();
  });
  $('service').addEventListener('change', () => { activeServiceId = $('service').value === 'auto' ? activeServiceId : $('service').value; renderTeam(); saveState(); });
  $('refresh').addEventListener('click', () => vscode.postMessage({ type: 'refresh' }));
  $('advanced').addEventListener('click', () => vscode.postMessage({ type: 'openAdvanced' }));
  function renderAttachmentList() {
    $('attachList').textContent = pendingAttachments.length ? pendingAttachments.map((a) => a.name).join(', ') : '';
  }
  $('attachBtn').addEventListener('click', () => $('attachInput').click());
  $('cancel').addEventListener('click', () => vscode.postMessage({ type: 'cancel' }));
  function readAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }
  $('attachInput').addEventListener('change', async () => {
    for (const file of Array.from($('attachInput').files || [])) {
      if (file.size > MAX_ATTACHMENT_BYTES) { $('status').textContent = `${file.name} exceeds the 8MB attachment limit.`; $('status').className = 'error'; continue; }
      const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
      const isImage = file.type.startsWith('image/');
      if (!isPdf && !isImage) { $('status').textContent = `${file.name}: only images and PDFs are supported.`; $('status').className = 'error'; continue; }
      const base64 = await readAsBase64(file);
      pendingAttachments.push({ type: isPdf ? 'pdf' : 'image', name: file.name, mime: file.type || (isPdf ? 'application/pdf' : 'image/png'), data: base64 });
    }
    $('attachInput').value = '';
    renderAttachmentList();
  });
  function setHistoryOpen(open) {
    $('historyMenu').hidden = !open;
    $('historyMenuButton').setAttribute('aria-expanded', String(open));
    if (open) vscode.postMessage({ type: 'listConversations' });
  }
  $('historyMenuButton').addEventListener('click', () => setHistoryOpen($('historyMenu').hidden));
  $('newConversation').addEventListener('click', () => { if (!historyBusy) vscode.postMessage({ type: 'newConversation' }); });
  document.addEventListener('click', (event) => {
    if (!$('historyMenu').hidden && !$('historyMenu').contains(event.target) && event.target !== $('historyMenuButton')) setHistoryOpen(false);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !$('historyMenu').hidden) { event.preventDefault(); setHistoryOpen(false); $('historyMenuButton').focus(); }
  });
  vscode.postMessage({ type: 'listConversations' });
  function sendPrompt() {
    const prompt = $('prompt').value.trim();
    if ((!prompt && !pendingAttachments.length) || $('prompt').disabled || !$('service').value) return;
    addMessage('user', prompt, '', true, undefined, pendingAttachments);
    $('prompt').value = '';
    $('prompt').disabled = true;
    vscode.postMessage({ type: 'run', serviceId: $('service').value, prompt, leanMode: $('lean').value, tokenSaver: $('tokenSaver').checked, attachments: pendingAttachments });
    pendingAttachments = [];
    renderAttachmentList();
  }
  $('prompt').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); sendPrompt(); }
  });
  window.addEventListener('message', (event) => {
    const message = event.data || {};
    if (message.type === 'state') {
      const current = $('service').value;
      services = Array.isArray(message.services) ? message.services : [];
      activityWords = Array.isArray(message.activityWords) ? message.activityWords : [];
      showActiveModel = Boolean(message.showActiveModel);
      $('cwdLine').textContent = message.cwd || '';
      const auto = text('option', 'Auto — analyze my request'); auto.value = 'auto';
      $('service').replaceChildren(auto, ...services.map((service) => { const option = text('option', service.label || service.id); option.value = service.id; return option; }));
      const preferred = current || restored.serviceId || 'auto';
      $('service').value = preferred === 'auto' || services.some((service) => service.id === preferred) ? preferred : 'auto';
      activeServiceId = activeServiceId || restored.activeServiceId || '';
      renderTeam();
      $('status').textContent = message.notice || '';
      $('status').className = message.error ? 'error' : 'muted';
    } else if (message.type === 'busy') {
      $('prompt').disabled = Boolean(message.value); $('refresh').disabled = Boolean(message.value);
      historyBusy = Boolean(message.value);
      $('historyMenu').classList.toggle('busy', historyBusy);
      $('newConversation').disabled = historyBusy;
      $('historyMenuButton').disabled = historyBusy;
      $('status').textContent = message.value ? 'The agent team is working…' : '';
      setBusy(Boolean(message.value));
    } else if (message.type === 'inference') {
      const models = showActiveModel ? (((message.inference || {}).active || []).map((item) => item.model).filter(Boolean)) : [];
      $('activeModels').textContent = models.length ? `Active: ${models.join(', ')}` : '';
    } else if (message.type === 'inferenceSetting') {
      showActiveModel = Boolean(message.enabled);
      if (!showActiveModel) $('activeModels').textContent = '';
    } else if (message.type === 'route') {
      const selection = message.selection || {};
      activeServiceId = selection.service_id || '';
      if (selection.source === 'slash-command') $('service').value = activeServiceId || 'auto';
      const confidence = selection.confidence && selection.confidence !== 'fixed' ? ` · ${selection.confidence} confidence` : '';
      $('route').textContent = activeServiceId ? `Active preset: ${selection.label || activeServiceId}${confidence}` : 'Automatic intent routing is active.';
      renderTeam(); saveState();
    } else if (message.type === 'command') {
      addMessage('assistant', message.content || '');
    } else if (message.type === 'conversations') {
      renderHistory(message.items || []);
    } else if (message.type === 'conversationIdentity') {
      activeConversationId = typeof message.id === 'string' ? message.id : activeConversationId;
      saveState();
    } else if (message.type === 'conversationSwitched') {
      activeConversationId = typeof message.id === 'string' ? message.id : null;
      messageSeq = 0;
      $('messages').replaceChildren();
      const items = Array.isArray(message.transcript) ? message.transcript : [];
      transcript = items.slice(-40).map((item) => ({
        id: item.id != null ? item.id : (messageSeq += 1),
        role: item.role,
        value: String(item.value || ''),
        detail: String(item.detail || ''),
        attachments: item.attachments || [],
      }));
      if (items.length) {
        for (const item of transcript) addMessage(item.role, item.value, item.detail, false, item.id, item.attachments);
        $('idleArt').style.display = 'none';
        $('messages').style.flex = '1';
      } else {
        $('idleArt').style.display = 'flex';
        $('messages').style.flex = '0';
      }
      if (message.serviceId && ($('service').querySelector(`option[value="${CSS.escape(message.serviceId)}"]`) || message.serviceId === 'auto')) {
        $('service').value = message.serviceId;
        renderTeam();
      }
      saveState();
      vscode.postMessage({ type: 'listConversations' });
      setHistoryOpen(false);
    } else if (message.type === 'delta') {
      appendStreamingDelta(message.text || '');
    } else if (message.type === 'deltaInterrupted') {
      if (streamingBox) {
        const body = streamingBox.children[1];
        body.append(text('div', 'connection interrupted — retrying without streaming…', 'error'));
      }
    } else if (message.type === 'result') {
      finishStreamingMessage();
      const result = message.result || {};
      activeServiceId = result.service_id || (result.selection && result.selection.service_id) || activeServiceId;
      renderTeam();
      const usage = result.usage || result.token_usage || {};
      const tokens = usage.total_tokens == null ? '' : ` · ${usage.total_tokens} tokens`;
      $('tokenLine').textContent = usage.total_tokens == null ? '' : `${usage.total_tokens} tokens`;
      const team = (result.agents || []).map((agent) => agent.model).filter(Boolean).join(', ');
      const selection = result.selection ? `${result.selection.source === 'intent-analysis' ? 'Auto-selected' : 'Selected'} ${result.selection.label} · ` : '';
      addMessage('assistant', result.answer || result.output || 'Completed without a text answer.', `${selection}${team || 'dynamic team'}${tokens}`);
    } else if (message.type === 'error') {
      finishStreamingMessage();
      setBusy(false);
      $('status').textContent = message.message || 'Request failed'; $('status').className = 'error';
    }
  });
  vscode.postMessage({
    type: 'ready',
    conversationId: activeConversationId,
    transcript: transcript.slice(-40),
    serviceId: restored.serviceId || 'auto',
  });
</script>
</body>
</html>
