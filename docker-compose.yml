# AetherStack — multi-model LLM control plane
# https://github.com/piksliviksi/aetherstack
#
# Prefer host Ollama for GPUs. Optional container: --profile with-ollama-container
# NVIDIA CUDA:  -f docker-compose.nvidia.yml --profile with-ollama-container
# AMD ROCm:     -f docker-compose.amd.yml --profile with-ollama-container
# Intel:        host Ollama / OpenVINO — see docs/GPU-INTEL.md

services:
  # Local OpenAI-compatible API + model manager
  # Prefer host Ollama (port 11434). Use GPU overlays when running in-container.
  ollama:
    # 0.32.4 shipped an incompatible llama-server in the Linux ARM64 image.
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.5}
    profiles: ["with-ollama-container"]
    ports:
      - "${AETHER_BIND_HOST:-127.0.0.1}:${AETHER_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ../models:/models
    restart: unless-stopped

  open-webui:
    # Keep in sync with volume schema (:main created the DB). Use TZ to reduce client loops.
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0}
    expose:
      - "8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - ENABLE_OLLAMA_API=false
      # Use the embedding model AetherStack provisions in Ollama. The Open WebUI
      # default downloads SentenceTransformers during first boot and can exceed
      # its own health-start window on a clean volume.
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - RAG_OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # AetherHub filters this to live capability-resolved aliases and bridges authenticated host CLIs.
      - OPENAI_API_BASE_URL=http://aether-hub:8766/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:?Run start.sh or start.ps1 to generate LITELLM_MASTER_KEY}
      - AETHER_OPENAI_BASE_URL=http://aether-hub:8766/v1
      - MODELS_CACHE_TTL=5
      - WEBUI_AUTH=true
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=X-AetherStack-Email
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=X-AetherStack-Name
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-http://127.0.0.1:3000;http://localhost:3000}
      # Never place auth responses, profile data, or chats in browser/proxy caches.
      - CACHE_CONTROL=no-cache, no-store, must-revalidate, max-age=0
      - WEBUI_SESSION_COOKIE_SAME_SITE=strict
      - WEBUI_AUTH_COOKIE_SAME_SITE=strict
      - TZ=Europe/Tallinn
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      # A local appliance must not poll for releases or repeatedly mount an update toast.
      # AetherStack updates Open WebUI through its own pinned, tested release process.
      - ENABLE_VERSION_UPDATE_CHECK=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open_webui_data:/app/backend/data
      - ./open-webui-config/seed.py:/aetherstack/seed_openwebui.py:ro
    # Restrict the SQLite DB, WAL, uploads, and model caches to the container user.
    command: ["bash", "-lc", "umask 077; chmod -R go-rwx /app/backend/data 2>/dev/null || true; python /aetherstack/seed_openwebui.py; exec bash start.sh"]
    depends_on:
      aether-hub:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: unless-stopped

  # Passwordless local session for the browser UI. The authenticated Open WebUI
  # backend is not published directly, and this proxy is fixed to loopback.
  open-webui-proxy:
    build: ./open-webui-proxy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - AETHER_LOCAL_WEBUI_EMAIL=${AETHER_LOCAL_WEBUI_EMAIL:-}
    volumes:
      - open_webui_data:/data:ro
    depends_on:
      open-webui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99}
    ports:
      - "${AETHER_BIND_HOST:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Backs LiteLLM's spend/budget tracking (/global/spend, /key/info). Internal-only,
  # not published to the host — nothing outside the compose network needs it.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:-litellm-local}
      - POSTGRES_DB=litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Capability matrix sync + shared agent memory (Redis-backed)
  aether-hub:
    build: ./aether-hub
    ports:
      - "${AETHER_BIND_HOST:-127.0.0.1}:8766:8766"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - AETHER_HUB_HOST=0.0.0.0
      - AETHER_PUBLIC_BIND_HOST=${AETHER_BIND_HOST:-127.0.0.1}
      - AETHER_HUB_PORT=8766
      - AETHERSTACK_VERSION=${AETHERSTACK_VERSION:-0.3.21}
      - AETHERSTACK_REVISION=${AETHERSTACK_REVISION:-}
      - AETHER_UPDATE_DIR=/host-aetherstack/updates
      - AETHER_MATRIX_SYNC_SEC=${AETHER_MATRIX_SYNC_SEC:-60}
      - AETHER_EMBED_MODEL=${AETHER_EMBED_MODEL:-nomic-embed-text}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Run start.sh or start.ps1 to generate LITELLM_MASTER_KEY}
      - AETHER_CLI_BRIDGE_URL=${AETHER_CLI_BRIDGE_URL:-http://host.docker.internal:8767}
      - AETHER_CLI_BRIDGE_TOKEN=${AETHER_CLI_BRIDGE_TOKEN:-}
      - AETHER_DISABLED_MODELS=${AETHER_DISABLED_MODELS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_KEY_PERSONAL=${OPENAI_API_KEY_PERSONAL:-}
      - OPENAI_API_KEY_ENTERPRISE=${OPENAI_API_KEY_ENTERPRISE:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_API_KEY_PERSONAL=${ANTHROPIC_API_KEY_PERSONAL:-}
      - ANTHROPIC_API_KEY_ENTERPRISE=${ANTHROPIC_API_KEY_ENTERPRISE:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_API_KEY_PERSONAL=${XAI_API_KEY_PERSONAL:-}
      - XAI_API_KEY_ENTERPRISE=${XAI_API_KEY_ENTERPRISE:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_API_KEY_PERSONAL=${GOOGLE_API_KEY_PERSONAL:-}
      - GOOGLE_API_KEY_ENTERPRISE=${GOOGLE_API_KEY_ENTERPRISE:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_API_KEY_PERSONAL=${MISTRAL_API_KEY_PERSONAL:-}
      - MISTRAL_API_KEY_ENTERPRISE=${MISTRAL_API_KEY_ENTERPRISE:-}
      - AETHER_BACKUP_DIR=${AETHER_BACKUP_DIR:-/backups}
      - AETHER_BACKUP_CONFIG=${AETHER_BACKUP_CONFIG:-/host-aetherstack/backup.yaml}
      - AETHER_BACKUP_S3_BUCKET=${AETHER_BACKUP_S3_BUCKET:-}
      - AETHER_BACKUP_S3_PREFIX=${AETHER_BACKUP_S3_PREFIX:-}
      - AETHER_BACKUP_AZURE_CONTAINER=${AETHER_BACKUP_AZURE_CONTAINER:-}
      - AETHER_GITHUB_TOKEN=${AETHER_GITHUB_TOKEN:-}
      - AETHER_BACKUP_AUTO=${AETHER_BACKUP_AUTO:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AETHER_COMBOS_CATALOG=/combos/catalog.yaml
      - AETHER_COMBOS_EXPORT=/combos/export
      - AETHER_COMBOS_IMPORT=/combos/import
      - AETHER_PIPELINES_CATALOG=/pipelines/catalog
      - AETHER_PIPELINES_USER=/pipelines/user
      - AETHER_PIPELINES_VOTES=/pipelines/votes.json
      - AETHER_GRAPHS_DIR=/pipelines/graphs
    volumes:
      - ./aether-hub/capability_matrix.yaml:/app/capability_matrix.yaml:ro
      - ./aether-hub/agent_modes.yaml:/app/agent_modes.yaml:ro
      - ./aether-hub/bootstrap.yaml:/app/bootstrap.yaml:ro
      - ./aether-hub/profiles:/app/profiles:ro
      - ./aether-hub/static:/app/static:ro
      - ./litellm_config.yaml:/app/litellm_config.yaml:ro
      - ./combos:/combos:ro
      - ./pipelines:/pipelines
      - ./.aetherstack:/host-aetherstack
      - ./.aetherstack/backups:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Unified gateway for Grok / OpenAI / Anthropic / Gemini / Mistral / local Ollama
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm@sha256:de8ec5c07c62938783b59ba4ae8b3ca144ab96afd855f5f556883920d0804449}
    ports:
      - "${AETHER_BIND_HOST:-127.0.0.1}:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./aetherstack_callback.py:/app/aetherstack_callback.py:ro
      - ./.aetherstack:/aetherstack-state
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_KEY_PERSONAL=${OPENAI_API_KEY_PERSONAL:-}
      - OPENAI_API_KEY_ENTERPRISE=${OPENAI_API_KEY_ENTERPRISE:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_API_KEY_PERSONAL=${ANTHROPIC_API_KEY_PERSONAL:-}
      - ANTHROPIC_API_KEY_ENTERPRISE=${ANTHROPIC_API_KEY_ENTERPRISE:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_API_KEY_PERSONAL=${XAI_API_KEY_PERSONAL:-}
      - XAI_API_KEY_ENTERPRISE=${XAI_API_KEY_ENTERPRISE:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_API_KEY_PERSONAL=${GOOGLE_API_KEY_PERSONAL:-}
      - GOOGLE_API_KEY_ENTERPRISE=${GOOGLE_API_KEY_ENTERPRISE:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_API_KEY_PERSONAL=${MISTRAL_API_KEY_PERSONAL:-}
      - MISTRAL_API_KEY_ENTERPRISE=${MISTRAL_API_KEY_ENTERPRISE:-}
      # Required by current LiteLLM for /v1/* — browsers must send Authorization header.
      # Default is for local lab only; change if you expose the port.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Run start.sh or start.ps1 to generate LITELLM_MASTER_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AETHER_INFERENCE_STATUS_PATH=/aetherstack-state/inference-status.json
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm-local}@postgres:5432/litellm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data:
  redis_data:
  postgres_data:
